<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feast — Purdue Dining Companion</title>
  <style>
    :root {
      --bg: #FAF8F5;
      --surface: #FFFFFF;
      --surface-alt: #F3EFEA;
      --border: #E6DFD6;
      --text: #1F1C19;
      --text-muted: #6C635B;
      --terracotta: #C84B31;
      --terracotta-dark: #A93B24;
      --terracotta-soft: #FBECE8;
      --leaf: #1D8A5A;
      --leaf-soft: #E7F5EE;
      --shadow: 0 10px 28px rgba(31, 28, 25, 0.06);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 1.25rem 1.15rem 4rem;
    }

    /* Top Header & Feast Brand Wordmark */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding-bottom: 1.1rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.4rem;
      flex-wrap: wrap;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      text-decoration: none;
    }

    .wordmark {
      font-size: 2.05rem;
      font-weight: 900;
      letter-spacing: -0.04em;
      color: var(--terracotta);
      display: inline-flex;
      align-items: baseline;
      line-height: 1;
    }

    .t-leaf-wrap {
      position: relative;
      display: inline-block;
    }

    .leaf-svg {
      position: absolute;
      top: -0.34em;
      right: -0.36em;
      width: 0.62em;
      height: 0.62em;
      pointer-events: none;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      flex-wrap: wrap;
    }

    .btn-ghost {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.52rem 0.9rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s ease;
    }

    .btn-ghost:hover {
      border-color: var(--terracotta);
      color: var(--terracotta);
    }

    .filter-count-pill {
      background: var(--terracotta);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 0.08rem 0.44rem;
      border-radius: 999px;
    }

    /* Greeting & Mode Switcher */
    .hero-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 1.25rem;
      margin-bottom: 1.4rem;
      flex-wrap: wrap;
    }

    .greeting h1 {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin-bottom: 0.2rem;
    }

    .greeting p {
      color: var(--text-muted);
      font-size: 0.94rem;
    }

    .meta-stamp {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .mode-pills {
      display: inline-flex;
      background: var(--surface-alt);
      padding: 0.28rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      gap: 0.22rem;
    }

    .mode-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.86rem;
      font-weight: 700;
      padding: 0.48rem 1rem;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .mode-btn.active {
      background: var(--terracotta);
      color: #FFFFFF;
      box-shadow: 0 3px 10px rgba(200, 75, 49, 0.26);
    }

    /* Target Banner (when DRI is enabled) */
    .target-banner {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0.85rem 1.1rem;
      margin-bottom: 1.35rem;
      display: none;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .target-banner.visible {
      display: flex;
    }

    .target-pills {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .t-pill {
      background: var(--surface-alt);
      border-radius: 10px;
      padding: 0.32rem 0.68rem;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .target-disclaimer {
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    /* Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(315px, 1fr));
      gap: 1.25rem;
    }

    .court-column {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .court-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 0.25rem;
    }

    .court-title {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -0.015em;
    }

    .hours-pill {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--leaf);
      background: var(--leaf-soft);
      padding: 0.2rem 0.62rem;
      border-radius: 999px;
    }

    .flashcard {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.16s ease;
    }

    .combo-head {
      padding: 1.05rem 1.15rem 0.45rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.65rem;
    }

    .combo-name {
      font-size: 1.06rem;
      font-weight: 800;
      line-height: 1.28;
      color: var(--text);
    }

    .card-counter-btn {
      flex-shrink: 0;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.76rem;
      font-weight: 800;
      padding: 0.28rem 0.62rem;
      border-radius: 999px;
      cursor: pointer;
    }

    .card-counter-btn:hover {
      border-color: var(--terracotta);
      color: var(--terracotta);
    }

    .combo-rationale-wrap {
      padding: 0.12rem 1.15rem 0.55rem;
      display: flex;
      flex-direction: column;
      gap: 0.42rem;
    }

    .rationale-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.36rem;
      align-self: flex-start;
      background: var(--leaf-soft);
      color: var(--leaf);
      border: 1px solid rgba(29, 138, 90, 0.18);
      border-radius: 10px;
      padding: 0.26rem 0.62rem;
      font-size: 0.74rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .rationale-badge.neutral {
      background: var(--surface-alt);
      color: var(--text-muted);
      border-color: var(--border);
    }

    .pillar-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.32rem;
    }

    .pillar-chip {
      font-size: 0.67rem;
      font-weight: 700;
      color: var(--text-muted);
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.13rem 0.48rem;
    }

    .plate-board {
      padding: 0.35rem 1.15rem 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.58rem;
    }

    .plate-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.62rem 0.78rem;
    }

    .plate-item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.18rem;
    }

    .role-tag {
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--terracotta);
    }

    .station-tag {
      font-size: 0.71rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .item-title {
      font-size: 0.92rem;
      font-weight: 700;
      margin-bottom: 0.2rem;
    }

    .item-macros {
      font-size: 0.76rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .card-footer {
      background: var(--surface-alt);
      border-top: 1px solid var(--border);
      padding: 0.78rem 1.15rem;
    }

    .totals-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.83rem;
      font-weight: 800;
      margin-bottom: 0.42rem;
    }

    .macro-bar {
      height: 6px;
      border-radius: 999px;
      overflow: hidden;
      display: flex;
      background: var(--border);
    }

    .bar-p { background: var(--terracotta); }
    .bar-c { background: #E2955A; }
    .bar-f { background: var(--leaf); }

    /* Drawer / Modal */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(25, 22, 19, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 50;
    }

    .overlay.open {
      display: flex;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      width: 100%;
      max-width: 540px;
      max-height: 88vh;
      overflow-y: auto;
      padding: 1.35rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.18);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .modal-head h2 {
      font-size: 1.15rem;
      font-weight: 800;
    }

    .close-btn {
      background: var(--surface-alt);
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 999px;
      font-size: 1.1rem;
      cursor: pointer;
      font-weight: 700;
    }

    .section-label {
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin: 0.9rem 0 0.5rem;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
      gap: 0.45rem;
    }

    .pill-check {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.45rem 0.65rem;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .pill-check input {
      accent-color: var(--terracotta);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.65rem;
      margin-top: 0.55rem;
    }

    .field label {
      display: block;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 0.22rem;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 0.52rem 0.68rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      font-size: 0.88rem;
      font-family: inherit;
      color: var(--text);
    }

    .btn-primary {
      width: 100%;
      margin-top: 1.1rem;
      background: var(--terracotta);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 0.72rem 1rem;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-primary:hover {
      background: var(--terracotta-dark);
    }

    .status-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.2rem 1.4rem;
      text-align: center;
      color: var(--text-muted);
      font-weight: 600;
    }

    .error-box {
      background: var(--terracotta-soft);
      border: 1px solid rgba(200, 75, 49, 0.3);
      color: var(--terracotta-dark);
      border-radius: 12px;
      padding: 0.85rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.88rem;
      font-weight: 700;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand" aria-label="Feast">
        <span class="wordmark">
          Feas<span class="t-leaf-wrap">t
            <svg class="leaf-svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M20 4C12 4 6 9 6 17C14 17 20 11 20 4Z" fill="#1D8A5A"/>
              <path d="M6 17C10 13 14 10 19 5" stroke="#E7F5EE" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </span>
        </span>
      </div>

      <div class="header-actions">
        <button type="button" class="btn-ghost" onclick="openModal('prefsModal')">
          Dietary &amp; Portions
          <span class="filter-count-pill" id="activeFilterCount" style="display:none;">0</span>
        </button>
        <button type="button" class="btn-ghost" onclick="openModal('feedbackModal')">
          Feedback
        </button>
      </div>
    </header>

    <section class="hero-bar">
      <div class="greeting">
        <h1 id="greetingTitle">Loading campus menus...</h1>
        <p id="greetingSub">Checking live dining court lines across Purdue.</p>
        <div class="meta-stamp" id="metaStamp"></div>
      </div>

      <div class="mode-pills" role="group" aria-label="Meal scoring mode">
        <button type="button" class="mode-btn active" data-mode="High" onclick="setMode('High')">Healthiest</button>
        <button type="button" class="mode-btn" data-mode="Mid" onclick="setMode('Mid')">Balanced</button>
        <button type="button" class="mode-btn" data-mode="Low" onclick="setMode('Low')">Yummiest</button>
      </div>
    </section>

    <div class="error-box" id="errorBox"></div>

    <div class="target-banner" id="targetBanner">
      <div class="target-pills" id="targetPills"></div>
      <div class="target-disclaimer" id="targetDisclaimer"></div>
    </div>

    <main id="cardsContainer">
      <div class="status-box">Fetching Purdue HFS dining court menus...</div>
    </main>
  </div>

  <!-- Dietary & Portion Preferences Modal -->
  <div class="overlay" id="prefsModal" onclick="if(event.target===this) closeModal('prefsModal')">
    <div class="modal">
      <div class="modal-head">
        <h2>Dietary &amp; Portion Preferences</h2>
        <button type="button" class="close-btn" onclick="closeModal('prefsModal')">&times;</button>
      </div>

      <div class="section-label">Dietary &amp; Allergy Filters</div>
      <div class="filter-grid" id="dietary_checkboxes">
        <label class="pill-check"><input type="checkbox" value="vegetarian" /> Vegetarian</label>
        <label class="pill-check"><input type="checkbox" value="vegan" /> Vegan</label>
        <label class="pill-check"><input type="checkbox" value="gluten-free" /> Gluten-Free</label>
        <label class="pill-check"><input type="checkbox" value="dairy-free" /> Dairy-Free</label>
        <label class="pill-check"><input type="checkbox" value="egg-free" /> Egg-Free</label>
        <label class="pill-check"><input type="checkbox" value="soy-free" /> Soy-Free</label>
        <label class="pill-check"><input type="checkbox" value="peanut-free" /> Peanut-Free</label>
        <label class="pill-check"><input type="checkbox" value="tree-nut-free" /> Tree-Nut-Free</label>
        <label class="pill-check"><input type="checkbox" value="shellfish-free" /> Shellfish-Free</label>
        <label class="pill-check"><input type="checkbox" value="fish-free" /> Fish-Free</label>
        <label class="pill-check"><input type="checkbox" value="sesame-free" /> Sesame-Free</label>
      </div>

      <div class="section-label">Personalized Portion Targets (DRI)</div>
      <label class="pill-check" style="margin-bottom:0.5rem;">
        <input type="checkbox" id="dri_enabled" onchange="toggleDriFields()" />
        Customize portions to my body &amp; meal goal
      </label>

      <div id="driFieldsWrap" style="display:none;">
        <div class="form-grid">
          <div class="field">
            <label for="dri_sex">Sex</label>
            <select id="dri_sex">
              <option value="M">Male</option>
              <option value="F">Female</option>
            </select>
          </div>
          <div class="field">
            <label for="dri_age">Age</label>
            <input type="number" id="dri_age" min="14" max="99" placeholder="19" />
          </div>
          <div class="field">
            <label for="dri_weight">Weight (lbs)</label>
            <input type="number" id="dri_weight" min="70" max="450" placeholder="155" />
          </div>
          <div class="field">
            <label for="dri_height">Height (in)</label>
            <input type="number" id="dri_height" min="48" max="88" placeholder="72" />
          </div>
          <div class="field">
            <label for="dri_activity">Activity Level</label>
            <select id="dri_activity">
              <option value="sedentary">Sedentary</option>
              <option value="moderate" selected>Moderate</option>
              <option value="active">Active</option>
            </select>
          </div>
          <div class="field">
            <label for="dri_meals">Meals / Day</label>
            <input type="number" id="dri_meals" min="1" max="6" value="2" />
          </div>
        </div>
        <div class="field" style="margin-top:0.65rem;">
          <label for="dri_goal">Meal Goal</label>
          <select id="dri_goal">
            <option value="Balanced Maintenance">Balanced Maintenance</option>
            <option value="High Protein / Muscle">High Protein / Muscle</option>
            <option value="Lean Cut / Fat Loss">Lean Cut / Fat Loss</option>
            <option value="Athletic Endurance">Athletic Endurance</option>
            <option value="Low-Carb / Blood Sugar">Low-Carb / Blood Sugar</option>
          </select>
        </div>
      </div>

      <div class="section-label">Preview Another Time (Optional)</div>
      <div class="field">
        <label for="sim_time">Campus Time (leave blank for right now)</label>
        <input type="text" id="sim_time" placeholder="e.g. 12:30 PM or 6:15 PM" />
      </div>

      <button type="button" class="btn-primary" onclick="applyPreferences()">Save &amp; Update Plates</button>
    </div>
  </div>

  <!-- Feedback Modal -->
  <div class="overlay" id="feedbackModal" onclick="if(event.target===this) closeModal('feedbackModal')">
    <div class="modal">
      <div class="modal-head">
        <h2>Send Feedback</h2>
        <button type="button" class="close-btn" onclick="closeModal('feedbackModal')">&times;</button>
      </div>
      <div class="field">
        <label for="fb_category">Topic</label>
        <select id="fb_category">
          <option value="General">General Feedback</option>
          <option value="Dish / Pairing">Dish or Pairing Suggestion</option>
          <option value="Ingredient / Allergy">Ingredient or Allergy Flag</option>
          <option value="Bug">Bug Report</option>
        </select>
      </div>
      <div class="field" style="margin-top:0.65rem;">
        <label for="fb_message">Note</label>
        <textarea id="fb_message" rows="4" placeholder="What would make Feast more helpful at Purdue?"></textarea>
      </div>
      <div class="field" style="margin-top:0.65rem;">
        <label for="fb_contact">Purdue Email or Name (optional)</label>
        <input type="text" id="fb_contact" placeholder="pete@purdue.edu" />
      </div>
      <div id="fbStatus" style="margin-top:0.6rem;font-size:0.84rem;font-weight:700;color:var(--leaf);"></div>
      <button type="button" class="btn-primary" onclick="submitFeedback()">Send Note</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'feast_dining_prefs_v9';

    const state = {
      health_intensity: 'High',
      dietary_filters: [],
      dri_enabled: false,
      sex: 'M',
      age: '',
      weight_lbs: '',
      height_in: '',
      activity_level: 'moderate',
      meals_per_day: 2,
      meal_goal: 'Balanced Maintenance',
      sim_time: ''
    };

    let lastRecommendations = [];
    const comboIndexByLoc = {};

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function loadPreferences() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          Object.assign(state, parsed);
          state.sim_time = '';
        }
      } catch (e) {}
    }

    function savePreferences() {
      try {
        const toSave = { ...state, sim_time: '' };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
      } catch (e) {}
    }

    function syncFormFromState() {
      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === state.health_intensity);
      });

      const activeSet = new Set(state.dietary_filters || []);
      document.querySelectorAll('#dietary_checkboxes input[type="checkbox"]').forEach(cb => {
        cb.checked = activeSet.has(cb.value);
      });

      const badge = document.getElementById('activeFilterCount');
      const count = activeSet.size + (state.dri_enabled ? 1 : 0);
      badge.textContent = String(count);
      badge.style.display = count > 0 ? 'inline-block' : 'none';

      document.getElementById('dri_enabled').checked = !!state.dri_enabled;
      document.getElementById('dri_sex').value = state.sex || 'M';
      document.getElementById('dri_age').value = state.age || '';
      document.getElementById('dri_weight').value = state.weight_lbs || '';
      document.getElementById('dri_height').value = state.height_in || '';
      document.getElementById('dri_activity').value = state.activity_level || 'moderate';
      document.getElementById('dri_meals').value = state.meals_per_day || 2;
      document.getElementById('dri_goal').value = state.meal_goal || 'Balanced Maintenance';
      document.getElementById('sim_time').value = state.sim_time || '';
      toggleDriFields();
    }

    function toggleDriFields() {
      const enabled = document.getElementById('dri_enabled').checked;
      document.getElementById('driFieldsWrap').style.display = enabled ? 'block' : 'none';
    }

    function openModal(id) {
      syncFormFromState();
      document.getElementById(id).classList.add('open');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('open');
    }

    function setMode(mode) {
      state.health_intensity = mode;
      savePreferences();
      syncFormFromState();
      fetchRecommendations();
    }

    function applyPreferences() {
      const selectedFilters = [];
      document.querySelectorAll('#dietary_checkboxes input[type="checkbox"]:checked').forEach(cb => {
        selectedFilters.push(cb.value);
      });

      state.dietary_filters = selectedFilters;
      state.dri_enabled = document.getElementById('dri_enabled').checked;
      state.sex = document.getElementById('dri_sex').value;
      state.age = document.getElementById('dri_age').value;
      state.weight_lbs = document.getElementById('dri_weight').value;
      state.height_in = document.getElementById('dri_height').value;
      state.activity_level = document.getElementById('dri_activity').value;
      state.meals_per_day = document.getElementById('dri_meals').value;
      state.meal_goal = document.getElementById('dri_goal').value;
      state.sim_time = document.getElementById('sim_time').value.trim();

      savePreferences();
      syncFormFromState();
      closeModal('prefsModal');
      fetchRecommendations();
    }

    function buildCardRationaleHtml(combo) {
      const bd = combo.score_breakdown || {};
      const notes = Array.isArray(bd.compatibility_notes) ? bd.compatibility_notes : [];
      let summaryText = bd.match_summary || '';

      if (!summaryText) {
        const pairing = notes.find(n => !n.startsWith('Cohesive ')) || notes[0] || 'Balanced campus plate';
        const firstReason = (combo.items && combo.items[0] && combo.items[0].reason) || '';
        const quality = firstReason.toLowerCase().includes('seed-oil-free')
          ? 'Verified seed-oil-free'
          : 'Balanced dining staple';
        summaryText = `${pairing} • ${quality}`;
      }

      const isVerifiedClean = summaryText.toLowerCase().includes('seed-oil-free');
      const pillarHtml = (
        typeof bd.culinary_compatibility === 'number' &&
        typeof bd.food_quality === 'number' &&
        typeof bd.nutrition_balance === 'number'
      )
        ? `<div class="pillar-chips">
            <span class="pillar-chip">Pairing ${Math.round(bd.culinary_compatibility)}</span>
            <span class="pillar-chip">Quality ${Math.round(bd.food_quality)}</span>
            <span class="pillar-chip">Balance ${Math.round(bd.nutrition_balance)}</span>
          </div>`
        : '';

      return `
        <div class="combo-rationale-wrap">
          <div class="rationale-badge ${isVerifiedClean ? '' : 'neutral'}">
            <span>${isVerifiedClean ? '&#10003;' : '&#9679;'}</span>
            <span>${escapeHtml(summaryText)}</span>
          </div>
          ${pillarHtml}
        </div>
      `;
    }

    function advanceLocationCard(locKey, direction) {
      const rec = lastRecommendations.find(r => r.location === locKey);
      if (!rec || !rec.combos || rec.combos.length <= 1) return;
      const total = rec.combos.length;
      const current = comboIndexByLoc[locKey] || 0;
      comboIndexByLoc[locKey] = direction === 'right'
        ? (current - 1 + total) % total
        : (current + 1) % total;
      renderCardsOnly();
    }

    function renderCardsOnly() {
      const container = document.getElementById('cardsContainer');
      if (!lastRecommendations.length) {
        container.innerHTML = `<div class="status-box">No matching plates found for the current filters and mode. Try switching to <strong>Balanced</strong> or relaxing an allergen filter.</div>`;
        return;
      }

      const columnsHtml = lastRecommendations.map(rec => {
        const combos = rec.combos && rec.combos.length ? rec.combos : [{
          combo_name: 'Recommended Plate',
          items: rec.items || [],
          totals: rec.totals || { calories: 0, protein: 0, carbs: 0, fat: 0 },
          macro_split: { protein_pct: 33, carbs_pct: 34, fat_pct: 33 },
          score_breakdown: {}
        }];

        const activeComboIdx = (comboIndexByLoc[rec.location] || 0) % combos.length;
        const combo = combos[activeComboIdx];
        const hasMultiple = combos.length > 1;
        const safeLoc = rec.location.replace(/'/g, "\\'");

        const itemsHtml = (combo.items || []).map(item => `
          <div class="plate-item">
            <div class="plate-item-top">
              <span class="role-tag">${escapeHtml(item.role || 'Item')}</span>
              <span class="station-tag">${escapeHtml(item.station || '')}</span>
            </div>
            <div class="item-title">${escapeHtml(item.name)}</div>
            <div class="item-macros">
              ${Math.round(item.calories)} kcal &middot; ${Math.round(item.protein)}g P &middot; ${Math.round(item.carbs)}g C &middot; ${Math.round(item.fat)}g F
              ${item.used_fallback ? ' &middot; <em>est.</em>' : ''}
            </div>
          </div>
        `).join('');

        const tot = combo.totals || { calories: 0, protein: 0, carbs: 0, fat: 0 };
        const split = combo.macro_split || { protein_pct: 33, carbs_pct: 34, fat_pct: 33 };

        return `
          <section class="court-column">
            <div class="court-header">
              <h2 class="court-title">${escapeHtml(rec.location)}</h2>
              <span class="hours-pill">${escapeHtml(rec.hours_status || 'Open')}</span>
            </div>

            <article class="flashcard">
              <div>
                <div class="combo-head">
                  <div class="combo-name">${escapeHtml(combo.combo_name)}</div>
                  ${hasMultiple ? `<button type="button" class="card-counter-btn" onclick="advanceLocationCard('${safeLoc}', 'left')" title="Next option">${activeComboIdx + 1} / ${combos.length} &rsaquo;</button>` : ''}
                </div>

                ${buildCardRationaleHtml(combo)}

                <div class="plate-board">${itemsHtml}</div>
              </div>

              <div class="card-footer">
                <div class="totals-row">
                  <span>${Math.round(tot.calories)} kcal total</span>
                  <span>${Math.round(tot.protein)}g P &middot; ${Math.round(tot.carbs)}g C &middot; ${Math.round(tot.fat)}g F</span>
                </div>
                <div class="macro-bar" title="Protein ${split.protein_pct}% | Carbs ${split.carbs_pct}% | Fat ${split.fat_pct}%">
                  <div class="bar-p" style="width:${split.protein_pct}%"></div>
                  <div class="bar-c" style="width:${split.carbs_pct}%"></div>
                  <div class="bar-f" style="width:${split.fat_pct}%"></div>
                </div>
              </div>
            </article>
          </section>
        `;
      }).join('');

      container.innerHTML = `<div class="cards-grid">${columnsHtml}</div>`;
    }

    async function fetchRecommendations() {
      const errorBox = document.getElementById('errorBox');
      errorBox.style.display = 'none';
      document.getElementById('cardsContainer').innerHTML = `<div class="status-box">Building best plates across open Purdue dining courts...</div>`;

      try {
        const res = await fetch('/api/recommend', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(state)
        });
        const data = await res.json();

        if (!res.ok) {
          errorBox.textContent = data.error || 'Unable to load recommendations.';
          errorBox.style.display = 'block';
          document.getElementById('cardsContainer').innerHTML = '';
          return;
        }

        document.getElementById('greetingTitle').textContent = data.greeting_title || 'Campus Dining Lineup';
        document.getElementById('greetingSub').textContent = data.greeting_sub || '';
        document.getElementById('metaStamp').textContent =
          `${data.timestamp} • ${data.open_locations_count} dining court${data.open_locations_count === 1 ? '' : 's'} serving`;

        const banner = document.getElementById('targetBanner');
        if (data.dri_enabled && data.targets && data.targets.per_meal) {
          const pm = data.targets.per_meal;
          document.getElementById('targetPills').innerHTML = `
            <span class="t-pill">Target: ~${Math.round(pm.calories)} kcal / meal</span>
            <span class="t-pill">Protein: ${Math.round(pm.protein_target)}g</span>
            <span class="t-pill">Carbs: ${Math.round(pm.carbs_target)}g</span>
            <span class="t-pill">Fat: ${Math.round(pm.fat_target)}g</span>
          `;
          document.getElementById('targetDisclaimer').textContent = data.targets.disclaimer || '';
          banner.classList.add('visible');
        } else {
          banner.classList.remove('visible');
        }

        lastRecommendations = data.recommendations || [];
        lastRecommendations.forEach(r => { comboIndexByLoc[r.location] = 0; });
        renderCardsOnly();
      } catch (err) {
        errorBox.textContent = 'Network error connecting to Feast server.';
        errorBox.style.display = 'block';
        document.getElementById('cardsContainer').innerHTML = '';
      }
    }

    async function submitFeedback() {
      const statusEl = document.getElementById('fbStatus');
      const payload = {
        category: document.getElementById('fb_category').value,
        message: document.getElementById('fb_message').value.trim(),
        contact: document.getElementById('fb_contact').value.trim()
      };
      if (!payload.message) {
        statusEl.style.color = 'var(--terracotta)';
        statusEl.textContent = 'Please write a short note first.';
        return;
      }
      try {
        const res = await fetch('/api/feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok) {
          statusEl.style.color = 'var(--leaf)';
          statusEl.textContent = data.message || 'Sent!';
          document.getElementById('fb_message').value = '';
          setTimeout(() => {
            statusEl.textContent = '';
            closeModal('feedbackModal');
          }, 1100);
        } else {
          statusEl.style.color = 'var(--terracotta)';
          statusEl.textContent = data.error || 'Could not send feedback.';
        }
      } catch (e) {
        statusEl.style.color = 'var(--terracotta)';
        statusEl.textContent = 'Network error sending feedback.';
      }
    }

    loadPreferences();
    syncFormFromState();
    fetchRecommendations();
  </script>
</body>
</html>
