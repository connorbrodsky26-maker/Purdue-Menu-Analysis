<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>Feast</title>
  <style>
    :root {
      --feast-red: #EF4444;
      --feast-red-dark: #DC2626;
      --leaf-green: #22C55E;
      --leaf-vein: #15803D;
      --gold: #CFB991;
      --gold-soft: #FAF6EE;
      --obsidian: #111111;
      --obsidian-2: #1E1E1E;
      --bg: #F4F4F2;
      --surface: #FFFFFF;
      --surface-alt: #F9F9F8;
      --border: #E5E4DF;
      --text: #161615;
      --muted: #66645E;
      --green: #15803D;
      --green-bg: #DCFCE7;
      --protein-bg: #DBEAFE;
      --protein-fg: #1E40AF;
      --carb-bg: #FEF3C7;
      --carb-fg: #92400E;
      --side-bg: #DCFCE7;
      --side-fg: #166534;
      --radius: 18px;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
      --float-shadow: 0 10px 30px rgba(0, 0, 0, 0.14), 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
      padding-bottom: calc(92px + env(safe-area-inset-bottom));
    }

    /* Ultra-Slim Top App Bar */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--obsidian);
      color: #FFFFFF;
      padding: 0.6rem 1rem;
      border-bottom: 1px solid #262624;
    }

    .topbar-inner {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    /* "Feast" Red Wordmark with Green Leaf at the '-' of the 't' */
    .brand-logo {
      display: inline-flex;
      align-items: baseline;
      user-select: none;
      line-height: 1;
    }

    .brand-text {
      font-size: 1.55rem;
      font-weight: 900;
      letter-spacing: -0.035em;
      color: var(--feast-red);
    }

    .brand-t {
      width: 19px;
      height: 24px;
      margin-left: -1px;
      transform: translateY(3px);
      overflow: visible;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--obsidian-2);
      border: 1px solid #33322E;
      color: #E7E5E4;
      border-radius: 999px;
      padding: 0.3rem 0.7rem;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    .status-chip strong {
      color: #FFFFFF;
    }

    main {
      max-width: 600px;
      margin: 0.8rem auto 0;
      padding: 0 0.85rem;
    }

    /* Active Filter Summary Strip */
    .active-pills-row {
      display: none;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 0.65rem;
    }

    .active-pills-row.visible {
      display: flex;
    }

    .mini-badge {
      background: var(--obsidian);
      color: #FFFFFF;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.22rem 0.6rem;
      border-radius: 999px;
    }

    .mini-badge.light {
      background: var(--surface);
      color: var(--obsidian);
      border: 1px solid var(--border);
    }

    /* Alert Banner */
    .alert-box {
      background: #FEF2F2;
      border: 1.5px solid #FECACA;
      color: #991B1B;
      border-radius: 14px;
      padding: 0.75rem 0.9rem;
      font-size: 0.84rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    /* Hero #1 Card & Runner-Up Cards */
    .rec-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 0.95rem;
      box-shadow: var(--shadow);
    }

    .rec-card.rank-1 {
      border: 2px solid var(--obsidian);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.1);
    }

    .hero-head {
      background: var(--obsidian);
      color: #FFFFFF;
      padding: 0.95rem 1.05rem;
    }

    .rec-card:not(.rank-1) .hero-head {
      background: var(--surface-alt);
      color: var(--text);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1rem;
    }

    .hero-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.35rem;
    }

    .rank-pill {
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      background: var(--gold);
      color: var(--obsidian);
    }

    .rec-card:not(.rank-1) .rank-pill {
      background: #E5E4DF;
      color: var(--text);
    }

    .live-hours {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.74rem;
      font-weight: 700;
      padding: 0.2rem 0.58rem;
      border-radius: 999px;
      background: rgba(22, 163, 74, 0.22);
      color: #86EFAC;
    }

    .rec-card:not(.rank-1) .live-hours {
      background: var(--green-bg);
      color: var(--green);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22C55E;
      flex-shrink: 0;
    }

    .court-name {
      font-size: 1.85rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .rec-card:not(.rank-1) .court-name {
      font-size: 1.35rem;
    }

    /* Menu-Board Plate List */
    .plate-board {
      padding: 0.45rem 0.85rem;
    }

    .menu-row {
      border-bottom: 1px solid var(--border);
      padding: 0.68rem 0.15rem;
      cursor: pointer;
      user-select: none;
    }

    .menu-row:last-child {
      border-bottom: none;
    }

    .menu-row-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem;
      min-height: 44px;
    }

    .menu-left {
      display: flex;
      flex-direction: column;
      gap: 0.22rem;
      min-width: 0;
    }

    .tag-line {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .role-tag {
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 0.12rem 0.42rem;
      border-radius: 5px;
    }

    .role-tag.protein {
      background: var(--protein-bg);
      color: var(--protein-fg);
    }

    .role-tag.carb {
      background: var(--carb-bg);
      color: var(--carb-fg);
    }

    .role-tag.side {
      background: var(--side-bg);
      color: var(--side-fg);
    }

    .mult-tag {
      font-size: 0.68rem;
      font-weight: 800;
      padding: 0.1rem 0.4rem;
      border-radius: 5px;
      background: var(--obsidian);
      color: var(--gold);
    }

    .food-title {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.25;
    }

    .menu-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
      text-align: right;
    }

    .macro-stack {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .protein-stat {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--obsidian);
    }

    .cal-stat {
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--muted);
    }

    .chevron {
      width: 18px;
      height: 18px;
      color: var(--muted);
      transition: transform 0.18s ease;
    }

    .menu-row.expanded .chevron {
      transform: rotate(180deg);
    }

    /* Hidden Item Detail Drawer */
    .item-details {
      display: none;
      margin-top: 0.55rem;
      padding: 0.6rem 0.7rem;
      background: var(--surface-alt);
      border-radius: 10px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .menu-row.expanded .item-details {
      display: block;
    }

    .detail-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem 0.85rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.25rem;
    }

    /* Plate Totals Footer */
    .plate-footer {
      background: var(--surface-alt);
      border-top: 1px solid var(--border);
      padding: 0.72rem 1rem;
    }

    .totals-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.84rem;
      font-weight: 800;
    }

    .totals-macros {
      color: var(--muted);
      font-weight: 700;
      font-size: 0.8rem;
    }

    .dri-bars {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.55rem 0.85rem;
      margin-top: 0.65rem;
      padding-top: 0.65rem;
      border-top: 1px dashed var(--border);
    }

    .bar-head {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      font-weight: 700;
      margin-bottom: 0.2rem;
    }

    .bar-track {
      height: 6px;
      background: #E5E4DF;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: var(--obsidian);
      border-radius: 999px;
    }

    .bar-fill.hit {
      background: var(--green);
    }

    /* Floating Gemini-Style Bottom Pill + Side Filter Button */
    .floating-dock {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(14px + env(safe-area-inset-bottom));
      z-index: 40;
      padding: 0 0.85rem;
      pointer-events: none;
    }

    .dock-inner {
      max-width: 560px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 0.55rem;
      pointer-events: auto;
    }

    .floating-pill {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(0, 0, 0, 0.08);
      padding: 0.3rem;
      border-radius: 999px;
      gap: 0.2rem;
      box-shadow: var(--float-shadow);
    }

    .seg-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 0.83rem;
      font-weight: 700;
      min-height: 42px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .seg-btn.active {
      background: var(--obsidian);
      color: #FFFFFF;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
    }

    .side-filter-btn {
      position: relative;
      width: 50px;
      height: 50px;
      border-radius: 999px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      color: var(--obsidian);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: var(--float-shadow);
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .side-filter-btn:active {
      transform: scale(0.95);
    }

    .side-filter-btn.has-filters {
      background: var(--obsidian);
      color: #FFFFFF;
    }

    .badge-dot {
      position: absolute;
      top: -2px;
      right: -2px;
      background: var(--feast-red);
      color: #FFFFFF;
      font-size: 0.68rem;
      font-weight: 800;
      min-width: 19px;
      height: 19px;
      padding: 0 4px;
      border-radius: 999px;
      border: 2px solid #FFFFFF;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Right-Side Filter Drawer */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }

    .sheet-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .side-drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 60;
      width: min(370px, 88vw);
      overflow-y: auto;
      background: var(--surface);
      border-radius: 22px 0 0 22px;
      padding: calc(1rem + env(safe-area-inset-top)) 1.05rem calc(1.5rem + env(safe-area-inset-bottom));
      transform: translateX(105%);
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: -10px 0 35px rgba(0, 0, 0, 0.22);
    }

    .side-drawer.open {
      transform: translateX(0);
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0.95rem;
    }

    .sheet-header h2 {
      font-size: 1.08rem;
      font-weight: 800;
    }

    .done-btn {
      background: var(--obsidian);
      color: #FFFFFF;
      border: none;
      border-radius: 999px;
      padding: 0.45rem 1rem;
      font-size: 0.84rem;
      font-weight: 800;
      cursor: pointer;
    }

    .sheet-section {
      margin-bottom: 1.25rem;
    }

    .sec-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.55rem;
    }

    .sec-title {
      font-size: 0.76rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    .clear-link {
      background: none;
      border: none;
      color: var(--feast-red-dark);
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
    }

    /* Tactile Filter Chips */
    .filter-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.45rem;
    }

    .pill-check {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      min-height: 44px;
      padding: 0.5rem 0.75rem;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--surface-alt);
    }

    .pill-check:has(input:checked) {
      background: #FEF2F2;
      border-color: var(--feast-red);
      font-weight: 800;
    }

    .pill-check input {
      accent-color: var(--feast-red);
      width: 17px;
      height: 17px;
    }

    /* Switch Row */
    .switch-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.75rem 0.85rem;
      background: var(--surface-alt);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      cursor: pointer;
      min-height: 50px;
    }

    .switch-card span {
      font-size: 0.88rem;
      font-weight: 700;
    }

    .switch-card input[type="checkbox"] {
      accent-color: var(--obsidian);
      width: 20px;
      height: 20px;
    }

    /* Biometrics Grid inside Drawer */
    .bio-box {
      display: none;
      margin-top: 0.75rem;
      padding: 0.85rem;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .bio-box.open {
      display: block;
    }

    .bio-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.6rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.22rem;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--muted);
    }

    .field input,
    .field select {
      min-height: 42px;
      padding: 0.45rem 0.6rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 0.9rem;
      background: #FFFFFF;
      color: var(--text);
    }

    .height-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.35rem;
    }

    .apply-btn {
      width: 100%;
      min-height: 44px;
      margin-top: 0.8rem;
      background: var(--obsidian);
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
    }

    .time-row {
      display: flex;
      gap: 0.45rem;
    }

    .time-row input {
      flex: 1;
      min-height: 44px;
      padding: 0.5rem 0.7rem;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 0.88rem;
    }

    .time-row button {
      min-height: 44px;
      padding: 0 0.95rem;
      border-radius: 12px;
      border: none;
      background: var(--obsidian);
      color: #FFFFFF;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* Loading Skeleton */
    .skeleton-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1.1rem;
      border: 1px solid var(--border);
    }

    .skel-line {
      height: 16px;
      border-radius: 8px;
      background: linear-gradient(90deg, #ECEBE6 25%, #F7F6F2 50%, #ECEBE6 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
      margin-bottom: 0.7rem;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>
  <!-- Ultra-Slim Top Header -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-logo" aria-label="Feast">
        <span class="brand-text">Feas</span><svg class="brand-t" viewBox="0 0 22 28" aria-hidden="true">
          <!-- Red vertical stem of the 't' -->
          <path d="M9.2 3.2 V20.2 C9.2 22.6 10.6 23.8 13.0 23.8 C14.3 23.8 15.4 23.5 16.2 23.1" fill="none" stroke="#EF4444" stroke-width="3.7" stroke-linecap="round"/>
          <!-- Little green leaf forming the '-' crossbar of the 't' -->
          <path d="M3.2 11.2 C6.4 7.4 13.6 7.2 19.0 10.5 C14.7 14.3 7.6 14.4 3.2 11.2 Z" fill="#22C55E"/>
          <path d="M5.0 11.1 Q11.2 10.3 17.3 10.6" fill="none" stroke="#15803D" stroke-width="1.15" stroke-linecap="round"/>
        </svg>
      </div>

      <button type="button" class="status-chip" id="open_time_sheet" title="Tap to change meal time">
        <span id="status_text">Loading live...</span>
      </button>
    </div>
  </header>

  <main>
    <!-- Active Filters / DRI Indicator Strip -->
    <div class="active-pills-row" id="active_pills_row"></div>

    <!-- Validation / Error Banner -->
    <div id="validation_banner" class="alert-box" style="display:none;"></div>

    <!-- Main Recommendation Feed -->
    <div id="results_container">
      <div class="skeleton-card">
        <div class="skel-line" style="width:35%;"></div>
        <div class="skel-line" style="width:65%; height:28px;"></div>
        <div class="skel-line" style="width:100%; height:48px; margin-top:1rem;"></div>
        <div class="skel-line" style="width:100%; height:48px;"></div>
      </div>
    </div>
  </main>

  <!-- Floating Gemini-Style Bottom Pill + Side Filter Button -->
  <nav class="floating-dock" aria-label="Meal Mode and Filters">
    <div class="dock-inner">
      <div class="floating-pill" role="radiogroup" aria-label="Meal Style Mode">
        <button type="button" class="seg-btn active" data-mode="High">Healthiest</button>
        <button type="button" class="seg-btn" data-mode="Mid">Balanced</button>
        <button type="button" class="seg-btn" data-mode="Low">Yummiest</button>
      </div>

      <button type="button" class="side-filter-btn" id="open_sheet_btn" aria-label="Open Filters and Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" y1="21" x2="4" y2="14"></line>
          <line x1="4" y1="10" x2="4" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12" y2="3"></line>
          <line x1="20" y1="21" x2="20" y2="16"></line>
          <line x1="20" y1="12" x2="20" y2="3"></line>
          <line x1="1" y1="14" x2="7" y2="14"></line>
          <line x1="9" y1="8" x2="15" y2="8"></line>
          <line x1="17" y1="16" x2="23" y2="16"></line>
        </svg>
        <span class="badge-dot" id="filter_badge" style="display:none;">0</span>
      </button>
    </div>
  </nav>

  <!-- Slide-In Side Drawer for Allergies, DRI Biometrics & Time -->
  <div class="sheet-backdrop" id="sheet_backdrop"></div>
  <aside class="side-drawer" id="control_sheet" aria-modal="true" role="dialog" aria-label="Filters and Preferences">
    <div class="sheet-header">
      <h2>Filters &amp; Portions</h2>
      <button type="button" class="done-btn" id="close_sheet_btn">Done</button>
    </div>

    <div id="sheet_validation" class="alert-box" style="display:none;"></div>

    <!-- 1. Allergies & Dietary -->
    <div class="sheet-section">
      <div class="sec-head">
        <span class="sec-title">Allergies &amp; Dietary</span>
        <button type="button" class="clear-link" id="clear_filters_btn">Clear all</button>
      </div>
      <div class="filter-grid" id="dietary_checkboxes">
        <label class="pill-check"><input type="checkbox" value="gluten-free" /> Gluten-Free</label>
        <label class="pill-check"><input type="checkbox" value="dairy-free" /> Dairy-Free</label>
        <label class="pill-check"><input type="checkbox" value="egg-free" /> Egg-Free</label>
        <label class="pill-check"><input type="checkbox" value="soy-free" /> Soy-Free</label>
        <label class="pill-check"><input type="checkbox" value="peanut-free" /> Peanut-Free</label>
        <label class="pill-check"><input type="checkbox" value="tree-nut-free" /> Tree-Nut-Free</label>
        <label class="pill-check"><input type="checkbox" value="shellfish-free" /> Shellfish-Free</label>
        <label class="pill-check"><input type="checkbox" value="vegetarian" /> Vegetarian</label>
      </div>
    </div>

    <!-- 2. Quick Bites Locations -->
    <div class="sheet-section">
      <label class="switch-card">
        <span>Include Quick Bites</span>
        <input type="checkbox" id="include_quick_bites" />
      </label>
    </div>

    <!-- 3. USDA DRI Biometric Portion Sizing -->
    <div class="sheet-section">
      <label class="switch-card">
        <span>Personalize Portions (DRI)</span>
        <input type="checkbox" id="dri_toggle" />
      </label>

      <div class="bio-box" id="dri_drawer">
        <div class="sec-head">
          <span class="sec-title">Your Body &amp; Targets</span>
          <button type="button" class="clear-link" id="clear_biometrics_btn">Reset</button>
        </div>

        <div class="bio-grid">
          <div class="field full">
            <label for="meal_goal">Nutrition Goal</label>
            <select id="meal_goal">
              <option value="Balanced Maintenance">Balanced Maintenance</option>
              <option value="High Protein / Muscle Gain">High Protein / Muscle Gain</option>
              <option value="Lean Cut / Fat Loss">Lean Cut / Fat Loss</option>
              <option value="Athletic Endurance / Energy">Athletic Endurance / Energy</option>
              <option value="Low-Carb / Blood Sugar Focus">Low-Carb / Blood Sugar Focus</option>
            </select>
          </div>

          <div class="field">
            <label for="sex">Sex</label>
            <select id="sex">
              <option value="">Select...</option>
              <option value="M">Male</option>
              <option value="F">Female</option>
            </select>
          </div>

          <div class="field">
            <label for="age">Age</label>
            <input type="number" id="age" min="15" max="99" placeholder="19" />
          </div>

          <div class="field">
            <label for="weight_lbs">Weight (lbs)</label>
            <input type="number" id="weight_lbs" min="70" max="450" step="0.5" placeholder="155" />
          </div>

          <div class="field">
            <label>Height</label>
            <div class="height-split">
              <select id="height_ft" aria-label="Height feet">
                <option value="">ft</option>
                <option value="4">4 ft</option>
                <option value="5">5 ft</option>
                <option value="6">6 ft</option>
                <option value="7">7 ft</option>
              </select>
              <select id="height_in" aria-label="Height inches">
                <option value="">in</option>
                <option value="0">0 in</option>
                <option value="1">1 in</option>
                <option value="2">2 in</option>
                <option value="3">3 in</option>
                <option value="4">4 in</option>
                <option value="5">5 in</option>
                <option value="6">6 in</option>
                <option value="7">7 in</option>
                <option value="8">8 in</option>
                <option value="9">9 in</option>
                <option value="10">10 in</option>
                <option value="11">11 in</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label for="activity_level">Activity</label>
            <select id="activity_level">
              <option value="">Select...</option>
              <option value="Sedentary">Sedentary</option>
              <option value="Moderate">Moderate</option>
              <option value="Active">Active</option>
            </select>
          </div>

          <div class="field">
            <label for="meals_per_day">Meals / Day</label>
            <select id="meals_per_day">
              <option value="">Select...</option>
              <option value="1">1 meal</option>
              <option value="2">2 meals</option>
              <option value="3">3 meals</option>
              <option value="4">4 meals</option>
              <option value="5">5 meals</option>
            </select>
          </div>
        </div>

        <button type="button" class="apply-btn" id="calculate_dri_btn">Apply Portions</button>
      </div>
    </div>

    <!-- 4. Campus Clock Override -->
    <div class="sheet-section" style="margin-bottom:0;">
      <div class="sec-head">
        <span class="sec-title">Check Another Time</span>
        <button type="button" class="clear-link" id="reset_time_btn">Use NOW</button>
      </div>
      <div class="time-row">
        <input type="text" id="sim_time" placeholder="e.g. 12:30 PM or 18:00" />
        <button type="button" id="apply_time_btn">Set</button>
      </div>
    </div>
  </aside>

  <script>
    const STORAGE_KEY = 'purdue_dining_optimizer_prefs_v2';

    const state = {
      health_intensity: 'High',
      dietary_filters: [],
      dri_enabled: false,
      include_quick_bites: false,
      meal_goal: 'Balanced Maintenance',
      sex: '',
      age: '',
      weight_lbs: '',
      height_ft: '',
      height_in: '',
      activity_level: '',
      meals_per_day: '',
      sim_time: ''
    };

    function loadPreferences() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const saved = JSON.parse(raw);
        Object.assign(state, saved);
        state.sim_time = '';
      } catch (e) {
        console.warn('Could not read saved preferences:', e);
      }
    }

    function savePreferences() {
      try {
        const toSave = { ...state, sim_time: '' };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
      } catch (e) {
        console.warn('Could not save preferences:', e);
      }
    }

    function openSheet() {
      document.getElementById('sheet_backdrop').classList.add('open');
      document.getElementById('control_sheet').classList.add('open');
    }

    function closeSheet() {
      document.getElementById('sheet_backdrop').classList.remove('open');
      document.getElementById('control_sheet').classList.remove('open');
    }

    function syncUIToState() {
      document.querySelectorAll('.seg-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === state.health_intensity);
      });

      document.querySelectorAll('#dietary_checkboxes input[type="checkbox"]').forEach(cb => {
        cb.checked = state.dietary_filters.includes(cb.value);
      });

      document.getElementById('include_quick_bites').checked = !!state.include_quick_bites;
      document.getElementById('dri_toggle').checked = !!state.dri_enabled;
      document.getElementById('dri_drawer').classList.toggle('open', !!state.dri_enabled);

      const extraCount =
        state.dietary_filters.length +
        (state.dri_enabled ? 1 : 0) +
        (state.include_quick_bites ? 1 : 0);

      const badge = document.getElementById('filter_badge');
      const trigger = document.getElementById('open_sheet_btn');
      if (extraCount > 0) {
        badge.textContent = extraCount;
        badge.style.display = 'inline-flex';
        trigger.classList.add('has-filters');
      } else {
        badge.style.display = 'none';
        trigger.classList.remove('has-filters');
      }

      const pillsRow = document.getElementById('active_pills_row');
      const pills = [];
      if (state.dri_enabled) {
        pills.push(`<span class="mini-badge">DRI: ${escapeHtml(state.meal_goal)}</span>`);
      }
      if (state.include_quick_bites) {
        pills.push(`<span class="mini-badge light">+ Quick Bites</span>`);
      }
      state.dietary_filters.forEach(f => {
        const label = f.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        pills.push(`<span class="mini-badge light">${escapeHtml(label)}</span>`);
      });

      if (pills.length > 0) {
        pillsRow.innerHTML = pills.join('');
        pillsRow.classList.add('visible');
      } else {
        pillsRow.innerHTML = '';
        pillsRow.classList.remove('visible');
      }

      document.getElementById('meal_goal').value = state.meal_goal || 'Balanced Maintenance';
      document.getElementById('sex').value = state.sex || '';
      document.getElementById('age').value = state.age || '';
      document.getElementById('weight_lbs').value = state.weight_lbs || '';
      document.getElementById('height_ft').value = state.height_ft || '';
      document.getElementById('height_in').value = state.height_in !== '' ? state.height_in : '';
      document.getElementById('activity_level').value = state.activity_level || '';
      document.getElementById('meals_per_day').value = state.meals_per_day || '';
    }

    function readBiometricsFromDOM() {
      state.meal_goal = document.getElementById('meal_goal').value;
      state.sex = document.getElementById('sex').value;
      state.age = document.getElementById('age').value.trim();
      state.weight_lbs = document.getElementById('weight_lbs').value.trim();
      state.height_ft = document.getElementById('height_ft').value;
      state.height_in = document.getElementById('height_in').value;
      state.activity_level = document.getElementById('activity_level').value;
      state.meals_per_day = document.getElementById('meals_per_day').value;
      state.sim_time = document.getElementById('sim_time').value.trim();
    }

    function validateBiometrics() {
      const missing = [];
      if (!state.sex) missing.push('Sex');
      if (!state.age) missing.push('Age');
      if (!state.weight_lbs) missing.push('Weight');
      if (!state.height_ft) missing.push('Height (ft)');
      if (state.height_in === '') missing.push('Height (in)');
      if (!state.activity_level) missing.push('Activity');
      if (!state.meals_per_day) missing.push('Meals/Day');
      return missing;
    }

    function showValidation(msg, inSheet = false) {
      const mainBox = document.getElementById('validation_banner');
      const sheetBox = document.getElementById('sheet_validation');
      mainBox.style.display = 'none';
      sheetBox.style.display = 'none';
      if (!msg) return;

      const target = inSheet ? sheetBox : mainBox;
      target.textContent = msg;
      target.style.display = 'block';
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatRoleBadge(rawRole) {
      const lower = String(rawRole || '').toLowerCase();
      if (lower.includes('protein')) return { cls: 'protein', label: 'PROTEIN' };
      if (lower.includes('carb') || lower.includes('grain')) return { cls: 'carb', label: 'CARB' };
      return { cls: 'side', label: 'SIDE' };
    }

    function renderMacroProgress(totals, perMeal) {
      if (!perMeal) return '';
      const metrics = [
        { label: 'Calories', val: totals.calories, target: perMeal.calories, unit: '' },
        { label: 'Protein', val: totals.protein, target: perMeal.protein_target, unit: 'g' },
        { label: 'Carbs', val: totals.carbs, target: perMeal.carbs_target, unit: 'g' },
        { label: 'Fat', val: totals.fat, target: perMeal.fat_target, unit: 'g' },
      ];

      const bars = metrics.map(m => {
        const pct = Math.min(100, Math.round((m.val / Math.max(m.target, 1)) * 100));
        const isHit = pct >= 80 && pct <= 120;
        return `
          <div>
            <div class="bar-head">
              <span>${m.label}</span>
              <span>${Math.round(m.val)}${m.unit} / ${Math.round(m.target)}${m.unit}</span>
            </div>
            <div class="bar-track">
              <div class="bar-fill ${isHit ? 'hit' : ''}" style="width:${pct}%"></div>
            </div>
          </div>
        `;
      }).join('');

      return `<div class="dri-bars">${bars}</div>`;
    }

    function renderRecommendations(data) {
      const resultsEl = document.getElementById('results_container');
      const statusEl = document.getElementById('status_text');

      const timePart = (data.timestamp || '').split(' ').slice(1).join(' ') || 'NOW';
      statusEl.innerHTML = `<strong>${escapeHtml(timePart)}</strong> &bull; ${data.open_locations_count} Open`;

      const recs = data.recommendations || [];
      if (recs.length === 0) {
        resultsEl.innerHTML = `
          <article class="rec-card">
            <div class="hero-head">
              <h2 class="court-name" style="font-size:1.3rem;">No Matching Plates Open</h2>
            </div>
          </article>
        `;
        return;
      }

      const perMeal = data.dri_enabled && data.targets ? data.targets.per_meal : null;

      resultsEl.innerHTML = recs.map((rec, idx) => {
        const isFirst = idx === 0;
        const rankLabel = isFirst ? '#1 Best Pick' : `#${idx + 1} Backup`;

        const itemsHtml = rec.items.map(it => {
          const role = formatRoleBadge(it.role);
          const showMult = data.dri_enabled || (it.servings && it.servings !== 1);
          const multBadge = showMult ? `<span class="mult-tag">${it.servings}x</span>` : '';
          const allergenStr = (it.allergens && it.allergens.length > 0)
            ? `Contains: ${it.allergens.join(', ')}`
            : 'No major allergens flagged';

          return `
            <div class="menu-row" onclick="this.classList.toggle('expanded')" role="button" tabindex="0" aria-label="Tap for ${escapeHtml(it.name)} details">
              <div class="menu-row-main">
                <div class="menu-left">
                  <div class="tag-line">
                    <span class="role-tag ${role.cls}">${role.label}</span>
                    ${multBadge}
                  </div>
                  <div class="food-title">${escapeHtml(it.name)}</div>
                </div>
                <div class="menu-right">
                  <div class="macro-stack">
                    <span class="protein-stat">${Math.round(it.protein)}g P</span>
                    <span class="cal-stat">${Math.round(it.calories)} kcal</span>
                  </div>
                  <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                  </svg>
                </div>
              </div>
              <div class="item-details">
                <div class="detail-grid">
                  <span>Station: ${escapeHtml(it.station)}</span>
                  <span>${it.protein}g P &bull; ${it.carbs}g C &bull; ${it.fat}g F</span>
                </div>
                <div>${escapeHtml(it.reason)} &bull; ${escapeHtml(allergenStr)}</div>
              </div>
            </div>
          `;
        }).join('');

        return `
          <article class="rec-card ${isFirst ? 'rank-1' : ''}">
            <div class="hero-head">
              <div class="hero-top-row">
                <span class="rank-pill">${rankLabel}</span>
                <span class="live-hours"><span class="pulse-dot"></span>${escapeHtml(rec.hours_status)}</span>
              </div>
              <h2 class="court-name">${escapeHtml(rec.location)}</h2>
            </div>

            <div class="plate-board">${itemsHtml}</div>

            <div class="plate-footer">
              <div class="totals-row">
                <span>Plate Total: ${Math.round(rec.totals.calories)} kcal</span>
                <span class="totals-macros">${Math.round(rec.totals.protein)}g P &bull; ${Math.round(rec.totals.carbs)}g C &bull; ${Math.round(rec.totals.fat)}g F</span>
              </div>
              ${renderMacroProgress(rec.totals, perMeal)}
            </div>
          </article>
        `;
      }).join('');
    }

    async function fetchRecommendations() {
      readBiometricsFromDOM();
      savePreferences();
      showValidation('');

      const payload = {
        health_intensity: state.health_intensity,
        dietary_filters: state.dietary_filters,
        dri_enabled: state.dri_enabled,
        include_quick_bites: state.include_quick_bites,
        sim_time: state.sim_time
      };

      if (state.dri_enabled) {
        const missing = validateBiometrics();
        if (missing.length > 0) {
          openSheet();
          document.getElementById('dri_drawer').classList.add('open');
          showValidation(`Enter ${missing.join(', ')} and tap "Apply Portions".`, true);
          return;
        }
        const totalInches = (parseInt(state.height_ft, 10) * 12) + parseInt(state.height_in, 10);
        payload.meal_goal = state.meal_goal;
        payload.sex = state.sex;
        payload.age = parseInt(state.age, 10);
        payload.weight_lbs = parseFloat(state.weight_lbs);
        payload.height_in = totalInches;
        payload.activity_level = state.activity_level;
        payload.meals_per_day = parseInt(state.meals_per_day, 10);
      }

      document.getElementById('status_text').textContent = 'Updating...';

      try {
        const res = await fetch('/api/recommend', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) {
          showValidation(data.error || 'Could not load recommendations.');
          return;
        }
        renderRecommendations(data);
      } catch (err) {
        showValidation('Network error connecting to Purdue menus.');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadPreferences();
      syncUIToState();

      document.querySelectorAll('.seg-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.health_intensity = btn.dataset.mode;
          syncUIToState();
          fetchRecommendations();
        });
      });

      document.getElementById('open_sheet_btn').addEventListener('click', openSheet);
      document.getElementById('open_time_sheet').addEventListener('click', openSheet);
      document.getElementById('close_sheet_btn').addEventListener('click', closeSheet);
      document.getElementById('sheet_backdrop').addEventListener('click', closeSheet);

      document.querySelectorAll('#dietary_checkboxes input[type="checkbox"]').forEach(cb => {
        cb.addEventListener('change', () => {
          state.dietary_filters = Array.from(
            document.querySelectorAll('#dietary_checkboxes input[type="checkbox"]:checked')
          ).map(el => el.value);
          syncUIToState();
          fetchRecommendations();
        });
      });

      document.getElementById('clear_filters_btn').addEventListener('click', () => {
        state.dietary_filters = [];
        syncUIToState();
        fetchRecommendations();
      });

      document.getElementById('include_quick_bites').addEventListener('change', (e) => {
        state.include_quick_bites = e.target.checked;
        syncUIToState();
        fetchRecommendations();
      });

      document.getElementById('dri_toggle').addEventListener('change', (e) => {
        state.dri_enabled = e.target.checked;
        syncUIToState();
        savePreferences();
        if (!state.dri_enabled) {
          showValidation('');
          fetchRecommendations();
        } else {
          const missing = validateBiometrics();
          if (missing.length === 0) {
            fetchRecommendations();
          } else {
            showValidation(`Enter ${missing.join(', ')} to size portions.`, true);
          }
        }
      });

      document.getElementById('calculate_dri_btn').addEventListener('click', () => {
        const missing = validateBiometrics();
        if (missing.length === 0) {
          closeSheet();
        }
        fetchRecommendations();
      });

      document.getElementById('clear_biometrics_btn').addEventListener('click', () => {
        state.sex = '';
        state.age = '';
        state.weight_lbs = '';
        state.height_ft = '';
        state.height_in = '';
        state.activity_level = '';
        state.meals_per_day = '';
        state.meal_goal = 'Balanced Maintenance';
        syncUIToState();
        savePreferences();
        showValidation('Stats cleared. Fill in your fields to recalculate.', true);
      });

      ['meal_goal', 'sex', 'age', 'weight_lbs', 'height_ft', 'height_in', 'activity_level', 'meals_per_day'].forEach(id => {
        document.getElementById(id).addEventListener('change', () => {
          readBiometricsFromDOM();
          savePreferences();
        });
      });

      document.getElementById('apply_time_btn').addEventListener('click', () => {
        closeSheet();
        fetchRecommendations();
      });

      document.getElementById('reset_time_btn').addEventListener('click', () => {
        document.getElementById('sim_time').value = '';
        closeSheet();
        fetchRecommendations();
      });

      fetchRecommendations();
    });
  </script>
</body>
</html>
