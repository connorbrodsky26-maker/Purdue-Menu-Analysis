<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F3EE" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Feast" />
  <meta name="application-name" content="Feast" />
  <title>Feast — Campus Dining</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='28' fill='%23F6F3EE'/%3E%3Ctext x='56' y='73' text-anchor='middle' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif' font-weight='900' font-size='34' letter-spacing='-1.5' fill='%23C84B31'%3EFeast%3C/text%3E%3Cpath d='M105 33C95 33 88 39 88 49C98 49 105 42 105 33Z' fill='%231D8A5A'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #F6F3EE;
      --surface: #FFFFFF;
      --surface-alt: #EFECE6;
      --surface-press: #E6E0D6;
      --border: #E2DDD4;
      --text: #1E1B18;
      --text-muted: #6E665D;
      --terracotta: #C84B31;
      --terracotta-dark: #A63A23;
      --terracotta-soft: #FBECE8;
      --leaf: #1D8A5A;
      --leaf-soft: #E6F4ED;
      --amber: #D98A3C;
      --shadow-sm: 0 3px 12px rgba(30, 27, 24, 0.045);
      --shadow-lg: 0 14px 34px rgba(30, 27, 24, 0.11);
      --radius-card: 24px;
      --radius-pill: 999px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      overflow-x: hidden;
      max-width: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      padding-bottom: calc(6.5rem + var(--safe-bottom));
    }

    /* Sticky Top Header + Dining Hall Switcher */
    header {
      position: sticky;
      top: 0;
      z-index: 35;
      background: rgba(246, 243, 238, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding-top: var(--safe-top);
    }

    .header-inner {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0.78rem 1.1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      user-select: none;
      cursor: pointer;
    }

    .wordmark {
      font-size: 1.92rem;
      font-weight: 900;
      letter-spacing: -0.045em;
      color: var(--terracotta);
      display: inline-flex;
      align-items: baseline;
      line-height: 1;
    }

    .t-leaf-wrap {
      position: relative;
      display: inline-block;
    }

    .leaf-svg {
      position: absolute;
      top: -0.34em;
      right: -0.36em;
      width: 0.62em;
      height: 0.62em;
      pointer-events: none;
    }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.42rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 0.42rem 0.85rem;
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--text);
      box-shadow: var(--shadow-sm);
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--leaf);
      display: inline-block;
      flex-shrink: 0;
    }

    /* Sticky Horizontal Dining Hall Switcher */
    .hall-switcher-wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0.1rem 1.1rem 0.75rem;
      display: none;
    }

    .hall-switcher-wrap.visible {
      display: block;
    }

    .hall-scroller {
      display: flex;
      align-items: center;
      gap: 0.48rem;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      -webkit-overflow-scrolling: touch;
    }

    .hall-scroller::-webkit-scrollbar {
      display: none;
    }

    .hall-pill {
      min-height: 44px;
      padding: 0 1rem;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.84rem;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      flex-shrink: 0;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.12s ease;
    }

    .hall-pill:active {
      transform: scale(0.97);
    }

    .hall-pill.active {
      background: var(--text);
      border-color: var(--text);
      color: #FFFFFF;
    }

    .hall-pill-count {
      font-size: 0.72rem;
      font-weight: 800;
      opacity: 0.72;
    }

    /* Main Content Container */
    .main-wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 1.15rem 1.1rem 2rem;
    }

    .hero-section {
      margin-bottom: 1.1rem;
    }

    .hero-section h1 {
      font-size: 1.58rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1.18;
      margin-bottom: 0.25rem;
      color: var(--text);
    }

    .hero-section p {
      font-size: 0.92rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Active Filters & Target Summary Strip */
    .active-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem;
      margin-bottom: 1.1rem;
    }

    .active-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 0.3rem 0.75rem;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text);
      text-transform: capitalize;
    }

    .active-chip.accent {
      background: var(--terracotta-soft);
      border-color: rgba(200, 75, 49, 0.25);
      color: var(--terracotta-dark);
      text-transform: none;
    }

    .error-banner {
      background: var(--terracotta-soft);
      border: 1px solid rgba(200, 75, 49, 0.3);
      color: var(--terracotta-dark);
      border-radius: 16px;
      padding: 0.9rem 1rem;
      margin-bottom: 1.1rem;
      font-size: 0.86rem;
      font-weight: 700;
      display: none;
    }

    /* Dining Hall Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.4rem;
    }

    @media (min-width: 720px) {
      .cards-grid {
        grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      }
      .cards-grid.single-focus {
        grid-template-columns: minmax(340px, 560px);
        justify-content: center;
      }
    }

    .court-card-wrap {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      overflow-x: clip;
    }

    .court-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 0.25rem;
    }

    .court-name {
      font-size: 1.14rem;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .court-hours {
      font-size: 0.77rem;
      font-weight: 800;
      color: var(--leaf);
      display: inline-flex;
      align-items: center;
      gap: 0.32rem;
    }

    .card-stage {
      position: relative;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    /* Delayed Swipe Hint Arrow Pill (44px+ tap target) */
    .swipe-hint-pill {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translate(-50%, 12px);
      z-index: 15;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(30, 27, 24, 0.94);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: var(--radius-pill);
      padding: 0 1.05rem;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.01em;
      white-space: nowrap;
      box-shadow: 0 10px 26px rgba(30, 27, 24, 0.28);
      opacity: 0;
      pointer-events: none;
      cursor: pointer;
      transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .swipe-hint-pill.visible {
      opacity: 1;
      transform: translate(-50%, 0);
      pointer-events: auto;
    }

    .swipe-hint-arrow {
      display: inline-flex;
      align-items: center;
      color: #FF8E72;
      animation: swipeArrowNudge 1.25s ease-in-out infinite;
    }

    @keyframes swipeArrowNudge {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(5px); }
    }

    .meal-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
      touch-action: pan-y;
      user-select: none;
      will-change: transform, opacity;
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.22s ease,
                  box-shadow 0.16s ease;
    }

    .meal-card.dragging {
      transition: none;
      cursor: grabbing;
      box-shadow: var(--shadow-lg);
    }

    .card-header {
      padding: 1.2rem 1.2rem 0.55rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
    }

    .combo-title {
      font-size: 1.18rem;
      font-weight: 900;
      line-height: 1.24;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    /* Pager Controls (44px+ touch targets) */
    .pager-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.3rem;
      flex-shrink: 0;
    }

    .pager-controls {
      display: inline-flex;
      align-items: center;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      height: 44px;
      padding: 0 0.2rem;
    }

    .pager-btn {
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.15rem;
      font-weight: 800;
      cursor: pointer;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .pager-btn:active {
      background: var(--surface-press);
      color: var(--terracotta);
    }

    .pager-label {
      font-size: 0.76rem;
      font-weight: 800;
      color: var(--text-muted);
      min-width: 2.1rem;
      text-align: center;
    }

    .pager-dots {
      display: inline-flex;
      align-items: center;
      gap: 0.32rem;
      padding-right: 0.35rem;
    }

    .pager-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--border);
      border: none;
      padding: 0;
      cursor: pointer;
      transition: width 0.2s ease, background 0.2s ease;
    }

    .pager-dot.active {
      width: 18px;
      background: var(--terracotta);
    }

    /* Single Concise Clean-Food / Match Badge */
    .rationale-box {
      padding: 0.1rem 1.2rem 0.7rem;
    }

    .rationale-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.38rem;
      background: var(--leaf-soft);
      color: var(--leaf);
      border: 1px solid rgba(29, 138, 90, 0.2);
      border-radius: var(--radius-pill);
      padding: 0.3rem 0.72rem;
      font-size: 0.76rem;
      font-weight: 800;
      line-height: 1.25;
      max-width: 100%;
    }

    .rationale-pill span:last-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .rationale-pill.neutral {
      background: var(--surface-alt);
      color: var(--text-muted);
      border-color: var(--border);
    }

    /* Clean Scannable Dish Rows (44px+ tap targets, Protein + Calories only by default) */
    .items-list {
      padding: 0.15rem 1.2rem 1.05rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .dish-row {
      min-height: 56px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 0.78rem 0.95rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: background 0.14s ease, border-color 0.14s ease;
    }

    .dish-row:active {
      background: var(--surface-press);
    }

    .dish-main-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.85rem;
    }

    .dish-info {
      min-width: 0;
    }

    .dish-meta-top {
      font-size: 0.69rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--terracotta);
      margin-bottom: 0.16rem;
    }

    .dish-meta-top span {
      color: var(--text-muted);
      font-weight: 600;
      text-transform: none;
      letter-spacing: 0;
    }

    .dish-name {
      font-size: 0.97rem;
      font-weight: 800;
      color: var(--text);
      line-height: 1.28;
    }

    .dish-right {
      text-align: right;
      flex-shrink: 0;
    }

    .dish-pro {
      font-size: 0.9rem;
      font-weight: 900;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .dish-cal {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .dish-chevron {
      font-size: 0.72rem;
      color: var(--text-muted);
      transition: transform 0.18s ease;
      display: inline-block;
    }

    .dish-row.expanded .dish-chevron {
      transform: rotate(180deg);
    }

    .dish-details {
      display: none;
      margin-top: 0.58rem;
      padding-top: 0.54rem;
      border-top: 1px dashed var(--border);
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 600;
      line-height: 1.4;
    }

    .dish-row.expanded .dish-details {
      display: block;
    }

    /* Card Bottom: Clean Protein + Calories Summary + Tap-to-Expand Macro/Score Drawer */
    .card-bottom {
      background: var(--surface-alt);
      border-top: 1px solid var(--border);
      padding: 0.45rem 0.75rem 0.45rem 1.2rem;
    }

    .card-summary-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      min-height: 44px;
    }

    .headline-macros {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.92rem;
      font-weight: 900;
      color: var(--text);
    }

    .headline-sep {
      color: var(--text-muted);
      font-weight: 600;
    }

    .details-toggle-btn {
      min-height: 44px;
      padding: 0 0.85rem;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.32rem;
      flex-shrink: 0;
    }

    .details-toggle-btn:active {
      background: var(--surface-press);
    }

    .details-toggle-btn .chev {
      transition: transform 0.18s ease;
      display: inline-block;
    }

    .card-bottom.expanded .details-toggle-btn .chev {
      transform: rotate(180deg);
    }

    .card-extra-panel {
      display: none;
      padding: 0.55rem 0.45rem 0.65rem 0;
      border-top: 1px dashed var(--border);
      margin-top: 0.25rem;
    }

    .card-bottom.expanded .card-extra-panel {
      display: block;
    }

    .extra-macros-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-bottom: 0.55rem;
    }

    .m-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.26rem 0.6rem;
      font-size: 0.76rem;
      font-weight: 800;
      color: var(--text);
    }

    .macro-bar-track {
      height: 7px;
      border-radius: var(--radius-pill);
      overflow: hidden;
      display: flex;
      background: var(--border);
      margin-bottom: 0.45rem;
    }

    .seg-p { background: var(--terracotta); }
    .seg-c { background: var(--amber); }
    .seg-f { background: var(--leaf); }

    .macro-pct-line {
      display: flex;
      justify-content: space-between;
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .pillar-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.38rem;
      margin-top: 0.6rem;
    }

    .pillar-tag {
      font-size: 0.71rem;
      font-weight: 700;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 0.18rem 0.58rem;
    }

    /* Floating Bottom Mode & Preferences Dock (Thumb-Zone Safe) */
    .bottom-dock {
      position: fixed;
      bottom: calc(1rem + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 0.55rem;
      max-width: calc(100vw - 1.25rem);
    }

    .mode-dock {
      display: inline-flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 0.28rem;
      box-shadow: var(--shadow-lg);
      gap: 0.18rem;
    }

    .dock-mode-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.86rem;
      font-weight: 800;
      min-height: 44px;
      padding: 0 1.05rem;
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: all 0.16s ease;
      white-space: nowrap;
    }

    .dock-mode-btn.active {
      background: var(--terracotta);
      color: #FFFFFF;
      box-shadow: 0 3px 10px rgba(200, 75, 49, 0.28);
    }

    .dock-filter-btn {
      position: relative;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      box-shadow: var(--shadow-lg);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color 0.15s ease, color 0.15s ease, transform 0.12s ease;
    }

    .dock-filter-btn:active {
      transform: scale(0.95);
    }

    .dock-badge {
      position: absolute;
      top: -2px;
      right: -2px;
      background: var(--terracotta);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 800;
      min-width: 20px;
      height: 20px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
      border: 2px solid var(--bg);
    }

    /* Preferences Sheet (Bottom Sheet on Mobile, Right Drawer on Desktop) */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(25, 22, 19, 0.44);
      z-index: 60;
      display: none;
    }

    .drawer-backdrop.open {
      display: block;
    }

    .prefs-drawer {
      position: fixed;
      top: auto;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      max-height: 88dvh;
      background: var(--bg);
      border-top: 1px solid var(--border);
      border-radius: 28px 28px 0 0;
      z-index: 70;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 -14px 40px rgba(0, 0, 0, 0.16);
    }

    .prefs-drawer.open {
      transform: translateY(0);
    }

    .sheet-handle-wrap {
      padding-top: 0.6rem;
      display: flex;
      justify-content: center;
      background: var(--surface);
      border-radius: 28px 28px 0 0;
    }

    .sheet-handle {
      width: 38px;
      height: 4px;
      border-radius: 999px;
      background: var(--border);
    }

    @media (min-width: 681px) {
      .prefs-drawer {
        top: 0;
        left: auto;
        right: 0;
        bottom: 0;
        max-width: 430px;
        max-height: 100dvh;
        border-top: none;
        border-left: 1px solid var(--border);
        border-radius: 0;
        transform: translateX(100%);
        box-shadow: -12px 0 36px rgba(0, 0, 0, 0.14);
      }

      .prefs-drawer.open {
        transform: translateX(0);
      }

      .sheet-handle-wrap {

    /* Self-Contained Full "Feast" Home Screen Icon & Web App Manifest Generator */
    (function setupFeastHomeScreenIcons() {
      function renderFeastWordmarkPng(size) {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        if (!ctx) return '';

        // Warm oat background matching app theme
        ctx.fillStyle = '#F6F3EE';
        ctx.fillRect(0, 0, size, size);

        // Size the full "Feast" wordmark so it fits comfortably inside safe icon margins
        let fontSize = Math.round(size * 0.28);
        const fontStack = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif';
        ctx.font = `900 ${fontSize}px ${fontStack}`;

        const maxTextWidth = size * 0.72;
        let metrics = ctx.measureText('Feast');
        if (metrics.width > maxTextWidth) {
          fontSize = Math.floor(fontSize * (maxTextWidth / metrics.width));
          ctx.font = `900 ${fontSize}px ${fontStack}`;
          metrics = ctx.measureText('Feast');
        }

        const textWidth = metrics.width;
        const ascent = metrics.actualBoundingBoxAscent || fontSize * 0.72;
        const descent = metrics.actualBoundingBoxDescent || fontSize * 0.16;

        // Slightly shift left so the leaf on the right of "t" balances visually
        const leafAllowance = fontSize * 0.14;
        const textX = (size - textWidth - leafAllowance) / 2;
        const textY = (size + ascent - descent) / 2 + fontSize * 0.04;

        ctx.fillStyle = '#C84B31';
        ctx.textBaseline = 'alphabetic';
        ctx.fillText('Feast', textX, textY);

        // Draw the green leaf perched on the top-right of the "t"
        const leafOriginX = textX + textWidth - fontSize * 0.03;
        const leafOriginY = textY - ascent + fontSize * 0.06;
        const leafScale = (fontSize * 0.62) / 24;

        ctx.save();
        ctx.translate(leafOriginX, leafOriginY - 24 * leafScale * 0.55);
        ctx.scale(leafScale, leafScale);

        ctx.beginPath();
        ctx.moveTo(20, 4);
        ctx.bezierCurveTo(12, 4, 6, 9, 6, 17);
        ctx.bezierCurveTo(14, 17, 20, 11, 20, 4);
        ctx.closePath();
        ctx.fillStyle = '#1D8A5A';
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(6, 17);
        ctx.quadraticCurveTo(11, 12, 19, 5);
        ctx.strokeStyle = '#E6F4ED';
        ctx.lineWidth = 1.7;
        ctx.lineCap = 'round';
        ctx.stroke();

        ctx.restore();

        return canvas.toDataURL('image/png');
      }

      try {
        const icon180 = renderFeastWordmarkPng(180);
        const icon192 = renderFeastWordmarkPng(192);
        const icon512 = renderFeastWordmarkPng(512);

        if (icon180) {
          const appleTouch = document.createElement('link');
          appleTouch.rel = 'apple-touch-icon';
          appleTouch.sizes = '180x180';
          appleTouch.href = icon180;
          document.head.appendChild(appleTouch);
        }

        if (icon192 && icon512) {
          const pngFavicon = document.createElement('link');
          pngFavicon.rel = 'icon';
          pngFavicon.type = 'image/png';
          pngFavicon.sizes = '192x192';
          pngFavicon.href = icon192;
          document.head.appendChild(pngFavicon);

          const manifest = {
            name: 'Feast',
            short_name: 'Feast',
            description: 'Fast, clean campus dining recommendations.',
            start_url: '/',
            display: 'standalone',
            background_color: '#F6F3EE',
            theme_color: '#F6F3EE',

            ]
          };

          const manifestLink = document.createElement('link');
          manifestLink.rel = 'manifest';
          manifestLink.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
          document.head.appendChild(manifestLink);
        }
      } catch (e) {}

    let swipeHintTimer = null;

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function locSlug(loc) {
      return String(loc || '').toLowerCase().replace(/[^a-z0-9]+/g, '_');
    }

    function isSwipeHintDismissed() {
      try {
        return sessionStorage.getItem(SWIPE_HINT_KEY) === '1';
      } catch (e) {
        return false;
      }
    }

    function dismissSwipeHint(markSeen = true) {
      if (swipeHintTimer) {
        clearTimeout(swipeHintTimer);
        swipeHintTimer = null;
      }
      if (markSeen) {
        try { sessionStorage.setItem(SWIPE_HINT_KEY, '1'); } catch (e) {}
      }
      const pill = document.getElementById('swipeHintPill');
      if (pill) {
        pill.classList.remove('visible');
      }
    }

    function scheduleSwipeHint() {
      if (swipeHintTimer) {
        clearTimeout(swipeHintTimer);
        swipeHintTimer = null;
      }
      if (isSwipeHintDismissed()) return;

      swipeHintTimer = setTimeout(() => {
        const pill = document.getElementById('swipeHintPill');
        if (pill && !isSwipeHintDismissed()) {
          pill.classList.add('visible');
        }
      }, 2200);
    }

    function loadPrefs() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const saved = JSON.parse(raw);
          Object.assign(state, saved);
          state.sim_time = '';
        }
      } catch (e) {}
    }

    function savePrefs() {
      try {
        const copy = { ...state, sim_time: '' };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(copy));
      } catch (e) {}
    }

    function syncUiFromState() {
      document.querySelectorAll('.dock-mode-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === state.health_intensity);
      });

      const activeSet = new Set(state.dietary_filters || []);
      document.querySelectorAll('#dietary_checkboxes input[type="checkbox"]').forEach(cb => {
        cb.checked = activeSet.has(cb.value);
      });

      const totalActive = activeSet.size + (state.dri_enabled ? 1 : 0) + (state.sim_time ? 1 : 0);
      const badge = document.getElementById('dockBadge');
      badge.textContent = String(totalActive);
      badge.style.display = totalActive > 0 ? 'inline-flex' : 'none';

      document.getElementById('dri_enabled').checked = !!state.dri_enabled;
      document.getElementById('dri_goal').value = state.meal_goal || 'Balanced Maintenance';
      document.getElementById('dri_sex').value = state.sex || '';
      document.getElementById('dri_age').value = state.age || '';
      document.getElementById('dri_weight').value = state.weight_lbs || '';
      document.getElementById('dri_ft').value = state.height_ft || '';
      document.getElementById('dri_in').value = state.height_in_rem || '';
      document.getElementById('dri_activity').value = state.activity_level || '';
      document.getElementById('dri_meals').value = state.meals_per_day || '';
      document.getElementById('sim_time').value = state.sim_time || '';
      toggleDriPanel();
    }

    function toggleDriPanel() {
      const open = document.getElementById('dri_enabled').checked;
      document.getElementById('driPanel').classList.toggle('open', open);
    }

    function openDrawer() {
      syncUiFromState();
      document.getElementById('drawerBackdrop').classList.add('open');
      document.getElementById('prefsDrawer').classList.add('open');
    }

    function closeDrawerAndApply() {
      document.getElementById('drawerBackdrop').classList.remove('open');
      document.getElementById('prefsDrawer').classList.remove('open');

      const selected = [];
      document.querySelectorAll('#dietary_checkboxes input[type="checkbox"]:checked').forEach(cb => {
        selected.push(cb.value);
      });

      state.dietary_filters = selected;
      state.dri_enabled = document.getElementById('dri_enabled').checked;
      state.meal_goal = document.getElementById('dri_goal').value;
      state.sex = document.getElementById('dri_sex').value;
      state.age = document.getElementById('dri_age').value;
      state.weight_lbs = document.getElementById('dri_weight').value;
      state.height_ft = document.getElementById('dri_ft').value;
      state.height_in_rem = document.getElementById('dri_in').value;
      state.activity_level = document.getElementById('dri_activity').value;
      state.meals_per_day = document.getElementById('dri_meals').value;
      state.sim_time = document.getElementById('sim_time').value.trim();

      savePrefs();
      syncUiFromState();
      fetchRecommendations();
    }

    function clearAllDietary() {
      document.querySelectorAll('#dietary_checkboxes input[type="checkbox"]').forEach(cb => {
        cb.checked = false;
      });
    }

    function resetToNow() {
      document.getElementById('sim_time').value = '';
      closeDrawerAndApply();
    }

    function selectMode(mode) {
      if (state.health_intensity === mode) return;
      state.health_intensity = mode;
      savePrefs();
      syncUiFromState();
      fetchRecommendations();
    }

    /* Sticky Dining Hall Switcher */
    function renderHallSwitcher() {
      const wrap = document.getElementById('hallSwitcherWrap');
      const scroller = document.getElementById('hallScroller');

      if (!lastRecommendations || lastRecommendations.length <= 1) {
        selectedHall = 'ALL';
        wrap.classList.remove('visible');
        scroller.innerHTML = '';
        return;
      }

      const validLocations = new Set(lastRecommendations.map(r => r.location));
      if (selectedHall !== 'ALL' && !validLocations.has(selectedHall)) {
        selectedHall = 'ALL';
      }

      const pillsHtml = [
        `<button type="button" class="hall-pill ${selectedHall === 'ALL' ? 'active' : ''}" onclick="selectHall('ALL')">
          All <span class="hall-pill-count">${lastRecommendations.length}</span>
        </button>`,
        ...lastRecommendations.map(rec => {
          const safeLoc = rec.location.replace(/'/g, "\\'");
          const isActive = selectedHall === rec.location;
          return `<button type="button" class="hall-pill ${isActive ? 'active' : ''}" onclick="selectHall('${safeLoc}')">
            ${escapeHtml(rec.location)}
          </button>`;
        })
      ].join('');

      scroller.innerHTML = pillsHtml;
      wrap.classList.add('visible');
    }

    function selectHall(loc) {
      if (selectedHall === loc) return;
      selectedHall = loc;
      renderHallSwitcher();
      renderCards();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function buildRationaleHtml(combo) {
      const bd = combo.score_breakdown || {};
      const notes = Array.isArray(bd.compatibility_notes) ? bd.compatibility_notes : [];
      let summary = bd.match_summary || '';

      if (!summary) {
        const pairing = notes.find(n => !n.startsWith('Cohesive ')) || notes[0] || 'Balanced plate';
        const firstReason = (combo.items && combo.items[0] && combo.items[0].reason) || '';
        const quality = firstReason.toLowerCase().includes('seed-oil-free')
          ? 'Verified seed-oil-free'
          : 'Balanced dining staple';
        summary = `${pairing} • ${quality}`;
      }

      const isClean = summary.toLowerCase().includes('seed-oil-free');

      return `
        <div class="rationale-box">
          <div class="rationale-pill ${isClean ? '' : 'neutral'}">
            <span>${isClean ? '&#10003;' : '&#9679;'}</span>
            <span>${escapeHtml(summary)}</span>
          </div>
        </div>
      `;
    }

    function buildCardInnerHtml(rec) {
      const combos = rec.combos && rec.combos.length ? rec.combos : [{
        combo_name: 'Recommended Plate',
        items: rec.items || [],
        totals: rec.totals || { calories: 0, protein: 0, carbs: 0, fat: 0 },
        macro_split: { protein_pct: 33, carbs_pct: 34, fat_pct: 33 },
        score_breakdown: {}
      }];

      const idx = (comboIndexByLoc[rec.location] || 0) % combos.length;
      const combo = combos[idx];
      const safeLoc = rec.location.replace(/'/g, "\\'");

      const dotsHtml = combos.length > 1
        ? `<div class="pager-dots">
            ${combos.map((_, dotIdx) => `
              <button type="button"
                class="pager-dot ${dotIdx === idx ? 'active' : ''}"
                onclick="jumpToCombo('${safeLoc}', ${dotIdx})"
                aria-label="Option ${dotIdx + 1}"></button>
            `).join('')}
          </div>`
        : '';

      const pagerHtml = combos.length > 1
        ? `<div class="pager-wrap">
            <div class="pager-controls">
              <button type="button" class="pager-btn" onclick="stepCard('${safeLoc}', -1)" aria-label="Previous option">&lsaquo;</button>
              <span class="pager-label">${idx + 1} / ${combos.length}</span>
              <button type="button" class="pager-btn" onclick="stepCard('${safeLoc}', 1)" aria-label="Next option">&rsaquo;</button>
            </div>
            ${dotsHtml}
          </div>`
        : '';

      const itemsHtml = (combo.items || []).map(it => `
        <div class="dish-row" onclick="toggleDishRow(this)">
          <div class="dish-main-line">
            <div class="dish-info">
              <div class="dish-meta-top">${escapeHtml(it.role || 'Item')} &bull; <span>${escapeHtml(it.station || '')}</span></div>
              <div class="dish-name">${escapeHtml(it.name)}</div>
            </div>
            <div class="dish-right">
              <div class="dish-pro">${Math.round(it.protein)}g P <span class="dish-chevron">&#9662;</span></div>
              <div class="dish-cal">${Math.round(it.calories)} kcal</div>
            </div>
          </div>
          <div class="dish-details">
            Carbs: ${Math.round(it.carbs)}g &middot; Fat: ${Math.round(it.fat)}g
            ${it.reason ? ` &middot; ${escapeHtml(it.reason)}` : ''}
          </div>
        </div>
      `).join('');

      const tot = combo.totals || { calories: 0, protein: 0, carbs: 0, fat: 0 };
      const split = combo.macro_split || { protein_pct: 33, carbs_pct: 34, fat_pct: 33 };
      const bd = combo.score_breakdown || {};
      const hasPillars = (
        typeof bd.culinary_compatibility === 'number' &&
        typeof bd.food_quality === 'number' &&
        typeof bd.nutrition_balance === 'number'
      );

      const pillarsHtml = hasPillars
        ? `<div class="pillar-row">
            <span class="pillar-tag">Pairing ${Math.round(bd.culinary_compatibility)}</span>
            <span class="pillar-tag">Quality ${Math.round(bd.food_quality)}</span>
            <span class="pillar-tag">Balance ${Math.round(bd.nutrition_balance)}</span>
          </div>`
        : '';

      return `
        <div>
          <div class="card-header">
            <div class="combo-title">${escapeHtml(combo.combo_name)}</div>
            ${pagerHtml}
          </div>

          ${buildRationaleHtml(combo)}

          <div class="items-list">${itemsHtml}</div>
        </div>

        <div class="card-bottom">
          <div class="card-summary-bar">
            <div class="headline-macros">
              <span>${Math.round(tot.protein)}g Protein</span>
              <span class="headline-sep">&middot;</span>
              <span>${Math.round(tot.calories)} kcal</span>
            </div>
            <button type="button" class="details-toggle-btn" onclick="toggleCardMacros(this)">
              <span>Details</span>
              <span class="chev">&#9662;</span>
            </button>
          </div>

          <div class="card-extra-panel">
            <div class="extra-macros-row">
              <span class="m-pill">${Math.round(tot.carbs)}g Carbs</span>
              <span class="m-pill">${Math.round(tot.fat)}g Fat</span>
            </div>
            <div class="macro-bar-track">
              <div class="seg-p" style="width:${split.protein_pct}%"></div>
              <div class="seg-c" style="width:${split.carbs_pct}%"></div>
              <div class="seg-f" style="width:${split.fat_pct}%"></div>
            </div>
            <div class="macro-pct-line">
              <span>&bull; Protein ${split.protein_pct}%</span>
              <span>&bull; Carbs ${split.carbs_pct}%</span>
              <span>&bull; Fat ${split.fat_pct}%</span>
            </div>
            ${pillarsHtml}
          </div>
        </div>
      `;
    }

    function toggleDishRow(rowEl) {
      if (dragState && dragState.moved) return;
      rowEl.classList.toggle('expanded');
    }

    function toggleCardMacros(btnEl) {
      if (dragState && dragState.moved) return;
      const footer = btnEl.closest('.card-bottom');
      if (footer) {
        footer.classList.toggle('expanded');
      }
    }

    function animateCardSwap(loc, targetIdx, direction) {
      const rec = lastRecommendations.find(r => r.location === loc);
      if (!rec || !rec.combos || rec.combos.length <= 1) return;
      if (animatingLoc[loc]) return;

      dismissSwipeHint(true);

      const cardEl = document.getElementById(`card-${locSlug(loc)}`);
      if (!cardEl) {
        comboIndexByLoc[loc] = targetIdx;
        return;
      }

      animatingLoc[loc] = true;
      const exitX = direction > 0 ? '-105%' : '105%';
      const exitRot = direction > 0 ? '-2.5deg' : '2.5deg';
      const enterX = direction > 0 ? '60%' : '-60%';

      cardEl.classList.remove('dragging');
      cardEl.style.transition = 'transform 0.19s cubic-bezier(0.4, 0, 1, 1), opacity 0.16s ease';
      cardEl.style.transform = `translateX(${exitX}) rotate(${exitRot})`;
      cardEl.style.opacity = '0';

      setTimeout(() => {
        comboIndexByLoc[loc] = targetIdx;
        cardEl.innerHTML = buildCardInnerHtml(rec);

        cardEl.style.transition = 'none';
        cardEl.style.transform = `translateX(${enterX}) scale(0.985)`;
        cardEl.style.opacity = '0';

        void cardEl.offsetWidth;

        cardEl.style.transition = 'transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease';
        cardEl.style.transform = 'translateX(0) rotate(0deg) scale(1)';
        cardEl.style.opacity = '1';

        setTimeout(() => {
          cardEl.style.transition = '';
          cardEl.style.transform = '';
          cardEl.style.opacity = '';
          animatingLoc[loc] = false;
        }, 260);
      }, 185);
    }

    function stepCard(loc, delta) {
      const rec = lastRecommendations.find(r => r.location === loc);
      if (!rec || !rec.combos || rec.combos.length <= 1) return;
      const len = rec.combos.length;
      const cur = comboIndexByLoc[loc] || 0;
      const nextIdx = (cur + delta + len) % len;
      animateCardSwap(loc, nextIdx, delta);
    }

    function jumpToCombo(loc, targetIdx) {
      const rec = lastRecommendations.find(r => r.location === loc);
      if (!rec || !rec.combos || rec.combos.length <= 1) return;
      const cur = comboIndexByLoc[loc] || 0;
      if (cur === targetIdx) return;
      const direction = targetIdx > cur ? 1 : -1;
      animateCardSwap(loc, targetIdx, direction);
    }

    function attachCardGestures() {
      document.querySelectorAll('.meal-card[data-loc]').forEach(cardEl => {
        const loc = cardEl.dataset.loc;

        cardEl.addEventListener('pointerdown', (e) => {
          if (e.button !== 0 && e.pointerType === 'mouse') return;
          if (e.target.closest('button')) return;
          const rec = lastRecommendations.find(r => r.location === loc);
          if (!rec || !rec.combos || rec.combos.length <= 1) return;
          if (animatingLoc[loc]) return;

          dragState = {
            loc,
            cardEl,
            pointerId: e.pointerId,
            startX: e.clientX,
            startY: e.clientY,
            startTime: performance.now(),
            dx: 0,
            lockedHorizontal: false,
            moved: false
          };
        });

        cardEl.addEventListener('pointermove', (e) => {
          if (!dragState || dragState.pointerId !== e.pointerId || dragState.loc !== loc) return;
          const dx = e.clientX - dragState.startX;
          const dy = e.clientY - dragState.startY;

          if (!dragState.lockedHorizontal) {
            if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 10) {
              dragState = null;
              return;
            }
            if (Math.abs(dx) > 10) {
              dragState.lockedHorizontal = true;
              dragState.moved = true;
              cardEl.classList.add('dragging');
              try { cardEl.setPointerCapture(e.pointerId); } catch (_) {}
            } else {
              return;
            }
          }

          dragState.dx = dx;
          const clamped = Math.max(-160, Math.min(160, dx));
          const rot = clamped * 0.018;
          const fade = 1 - Math.min(Math.abs(clamped) / 420, 0.25);
          cardEl.style.transform = `translateX(${clamped}px) rotate(${rot}deg)`;
          cardEl.style.opacity = String(fade);
        });

        const endDrag = (e) => {
          if (!dragState || dragState.pointerId !== e.pointerId || dragState.loc !== loc) return;
          const currentDrag = dragState;
          cardEl.classList.remove('dragging');
          try { cardEl.releasePointerCapture(e.pointerId); } catch (_) {}

          const elapsed = Math.max(performance.now() - currentDrag.startTime, 1);
          const velocity = Math.abs(currentDrag.dx) / elapsed;
          const passedThreshold = currentDrag.lockedHorizontal && (Math.abs(currentDrag.dx) > 58 || (Math.abs(currentDrag.dx) > 28 && velocity > 0.45));

          if (passedThreshold) {
            const delta = currentDrag.dx < 0 ? 1 : -1;
            dragState = null;
            stepCard(loc, delta);
          } else {
            if (currentDrag.lockedHorizontal) {
              cardEl.style.transition = 'transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease';
              cardEl.style.transform = 'translateX(0) rotate(0deg)';
              cardEl.style.opacity = '1';
              setTimeout(() => {
                cardEl.style.transition = '';
                cardEl.style.transform = '';
                cardEl.style.opacity = '';
              }, 245);
            }
            setTimeout(() => { dragState = null; }, 30);
          }
        };

        cardEl.addEventListener('pointerup', endDrag);
        cardEl.addEventListener('pointercancel', endDrag);
      });
    }

    function renderCards() {
      const container = document.getElementById('cardsContainer');
      if (!lastRecommendations.length) {
        container.innerHTML = `<div class="empty-state">No matching plates found for your active filters. Try switching to <strong>Balanced</strong> or relaxing a filter in Preferences.</div>`;
        return;
      }

      const visibleRecs = selectedHall === 'ALL'
        ? lastRecommendations
        : lastRecommendations.filter(r => r.location === selectedHall);

      let attachedHint = false;

      const html = visibleRecs.map(rec => {
        const slug = locSlug(rec.location);
        const safeLoc = rec.location.replace(/'/g, "\\'");
        const hasMultiple = Array.isArray(rec.combos) && rec.combos.length > 1;

        let hintHtml = '';
        if (hasMultiple && !attachedHint && !isSwipeHintDismissed()) {
          attachedHint = true;
          hintHtml = `
            <button type="button"
              class="swipe-hint-pill"
              id="swipeHintPill"
              onclick="stepCard('${safeLoc}', 1)"
              aria-label="Swipe card for more meal options">
              <span>Swipe for more options</span>
              <span class="swipe-hint-arrow" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M5 12h14"></path>
                  <path d="m13 6 6 6-6 6"></path>
                </svg>
              </span>
            </button>
          `;
        }

        return `
          <section class="court-card-wrap">
            <div class="court-top-row">
              <h2 class="court-name">${escapeHtml(rec.location)}</h2>
              <span class="court-hours">&bull; ${escapeHtml(rec.hours_status || 'Open')}</span>
            </div>

            <div class="card-stage">
              <article class="meal-card" id="card-${slug}" data-loc="${escapeHtml(rec.location)}">
                ${buildCardInnerHtml(rec)}
              </article>
              ${hintHtml}
            </div>
          </section>
        `;
      }).join('');

      const focusClass = visibleRecs.length === 1 ? 'single-focus' : '';
      container.innerHTML = `<div class="cards-grid ${focusClass}">${html}</div>`;
      attachCardGestures();
      scheduleSwipeHint();
    }

    async function fetchRecommendations() {
      const errEl = document.getElementById('errorBanner');
      errEl.style.display = 'none';
      dismissSwipeHint(false);
      document.getElementById('cardsContainer').innerHTML = `
        <div class="skeleton-grid">
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>
      `;

      let totalHeightInches = null;
      if (state.height_ft !== '' && state.height_in_rem !== '') {
        totalHeightInches = (parseInt(state.height_ft, 10) * 12) + parseInt(state.height_in_rem, 10);
      }

      const payload = {
        health_intensity: state.health_intensity,
        dietary_filters: state.dietary_filters,
        dri_enabled: state.dri_enabled,
        meal_goal: state.meal_goal,
        sex: state.sex,
        age: state.age,
        weight_lbs: state.weight_lbs,
        height_in: totalHeightInches,
        activity_level: state.activity_level,
        meals_per_day: state.meals_per_day,
        sim_time: state.sim_time
      };

      try {
        const res = await fetch('/api/recommend', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (!res.ok) {
          errEl.textContent = data.error || 'Unable to load recommendations.';
          errEl.style.display = 'block';
          document.getElementById('cardsContainer').innerHTML = '';
          return;
        }

        document.getElementById('greetingTitle').textContent = data.greeting_title || 'Campus Dining Lineup';
        document.getElementById('greetingSub').textContent = data.greeting_sub || '';

        const timeLabel = (data.timestamp || '').split(' ').slice(1).join(' ');
        document.getElementById('liveStatusText').textContent =
          `${timeLabel || 'Live'} • ${data.open_locations_count} Open`;

        const strip = document.getElementById('activeStrip');
        const chips = [];
        (state.dietary_filters || []).forEach(f => {
          chips.push(`<span class="active-chip">${escapeHtml(f)}</span>`);
        });
        if (data.dri_enabled && data.targets && data.targets.per_meal) {
          const pm = data.targets.per_meal;
          chips.push(`<span class="active-chip accent">Target ~${Math.round(pm.calories)} kcal &middot; ${Math.round(pm.protein_target)}g P</span>`);
        }
        if (chips.length) {
          strip.innerHTML = chips.join('');
          strip.style.display = 'flex';
        } else {
          strip.style.display = 'none';
        }

        lastRecommendations = data.recommendations || [];
        lastRecommendations.forEach(r => { comboIndexByLoc[r.location] = 0; });
        renderHallSwitcher();
        renderCards();
      } catch (err) {
        errEl.textContent = 'Network error connecting to Feast server.';
        errEl.style.display = 'block';
        document.getElementById('cardsContainer').innerHTML = '';
      }
    }

    async function submitFeedback() {
      const statusEl = document.getElementById('fbStatus');
      const payload = {
        category: document.getElementById('fb_category').value,
        message: document.getElementById('fb_message').value.trim(),
        contact: document.getElementById('fb_contact').value.trim()
      };
      if (!payload.message) {
        statusEl.style.color = 'var(--terracotta)';
        statusEl.textContent = 'Please write a short note first.';
        return;
      }
      try {
        const res = await fetch('/api/feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok) {
          statusEl.style.color = 'var(--leaf)';
          statusEl.textContent = data.message || 'Thanks for helping shape Feast!';
          document.getElementById('fb_message').value = '';
        } else {
          statusEl.style.color = 'var(--terracotta)';
          statusEl.textContent = data.error || 'Could not send feedback.';
        }
      } catch (e) {
        statusEl.style.color = 'var(--terracotta)';
        statusEl.textContent = 'Network error sending feedback.';
      }
    }

    loadPrefs();
    syncUiFromState();
    fetchRecommendations();
  </script>
</body>
</html>
