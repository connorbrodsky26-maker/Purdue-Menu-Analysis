<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FBF9F5" />
  <title>Feast — Campus Dining</title>
  <style>
    :root {
      --cream: #FBF9F5;
      --surface: #FFFFFF;
      --surface-alt: #F4F0E8;
      --border: #E7E1D6;
      --obsidian: #161513;
      --text-main: #161513;
      --text-muted: #6E695F;
      --terracotta: #E05648;
      --terracotta-dark: #C84639;
      --terracotta-soft: #FDF2F1;
      --leaf: #1D8A5A;
      --leaf-bright: #10B981;
      --leaf-soft: #E8F6EF;
      --radius: 22px;
      --shadow: 0 8px 26px rgba(22, 21, 19, 0.045);
      --float-shadow: 0 14px 36px rgba(22, 21, 19, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      overscroll-behavior-y: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--cream);
      color: var(--text-main);
      line-height: 1.45;
      padding-bottom: calc(104px + env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(251, 249, 245, 0.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      padding: 0.75rem 1.1rem;
      border-bottom: 1px solid var(--border);
    }

    .topbar-inner {
      max-width: 560px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
    }

    .brand-logo {
      display: inline-flex;
      align-items: baseline;
      user-select: none;
      line-height: 1;
    }

    .brand-text {
      font-size: 1.7rem;
      font-weight: 900;
      letter-spacing: -0.04em;
      color: var(--terracotta);
    }

    .brand-t {
      width: 24px;
      height: 30px;
      margin-left: -1px;
      transform: translateY(4px);
      overflow: visible;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 999px;
      padding: 0.38rem 0.85rem;
      font-size: 0.77rem;
      font-weight: 600;
      cursor: pointer;
    }

    .status-chip strong {
      color: var(--terracotta);
    }

    main {
      width: 100%;
      max-width: 560px;
      margin: 1rem auto 0;
      padding: 0 1rem;
    }

    .greeting-banner {
      margin-bottom: 1rem;
      padding: 0 0.15rem;
    }

    .greeting-title {
      font-size: 1.36rem;
      font-weight: 900;
      letter-spacing: -0.025em;
      color: var(--obsidian);
      line-height: 1.2;
    }

    .greeting-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.18rem;
      font-weight: 500;
    }

    .active-pills-row {
      display: none;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 0.85rem;
    }

    .active-pills-row.visible {
      display: flex;
    }

    .mini-badge {
      background: var(--obsidian);
      color: #FFFFFF;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.24rem 0.65rem;
      border-radius: 999px;
    }

    .mini-badge.light {
      background: var(--surface);
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .alert-box {
      background: var(--terracotta-soft);
      border: 1px solid #F5C2BC;
      color: #8F2D23;
      border-radius: 16px;
      padding: 0.85rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.9rem;
    }

    .court-section {
      width: 100%;
      max-width: 100%;
      margin-bottom: 1.5rem;
    }

    .court-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      padding: 0 0.2rem 0.55rem;
    }

    .court-name {
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      color: var(--obsidian);
      line-height: 1.15;
    }

    .live-hours {
      display: inline-flex;
      align-items: center;
      gap: 0.36rem;
      font-size: 0.73rem;
      font-weight: 700;
      padding: 0.24rem 0.65rem;
      border-radius: 999px;
      background: var(--leaf-soft);
      color: var(--leaf);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--leaf-bright);
      flex-shrink: 0;
    }

    .deck-wrapper {
      position: relative;
      width: 100%;
      max-width: 100%;
      padding-bottom: 10px;
    }

    .flashcard-deck {
      position: relative;
      width: 100%;
      max-width: 100%;
      touch-action: pan-y;
      -webkit-user-select: none;
      user-select: none;
    }

    .deck-underlay-1,
    .deck-underlay-2 {
      position: absolute;
      inset: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.28s ease;
    }

    .deck-underlay-1 {
      z-index: 1;
      transform: translate3d(0, 6px, 0) scale(0.975);
      background: #FCFBF8;
      cursor: pointer;
    }

    .deck-underlay-2 {
      z-index: 0;
      transform: translate3d(0, 12px, 0) scale(0.95);
      background: var(--surface-alt);
      pointer-events: none;
    }

    .flashcard {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      transform: translate3d(0, 0, 0) rotate(0deg);
      will-change: transform, opacity;
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.26s ease;
    }

    .flashcard.dragging {
      transition: none !important;
      cursor: grabbing;
    }

    .flashcard.shuffle-out-left {
      transform: translate3d(-115%, -8px, 0) rotate(-7deg) !important;
      opacity: 0 !important;
    }

    .flashcard.shuffle-out-right {
      transform: translate3d(115%, -8px, 0) rotate(7deg) !important;
      opacity: 0 !important;
    }

    @keyframes physicalCardPeek {
      0% { transform: translate3d(0, 0, 0) rotate(0deg); }
      28% { transform: translate3d(-34px, 0, 0) rotate(-2.2deg); }
      55% { transform: translate3d(8px, 0, 0) rotate(0.6deg); }
      78% { transform: translate3d(-14px, 0, 0) rotate(-0.9deg); }
      100% { transform: translate3d(0, 0, 0) rotate(0deg); }
    }

    .flashcard.peek-demo {
      animation: physicalCardPeek 1.5s cubic-bezier(0.25, 0.9, 0.35, 1) forwards;
    }

    .swipe-hint-overlay {
      position: absolute;
      inset: 0;
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .swipe-hint-overlay.visible {
      opacity: 1;
    }

    .swipe-hint-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: rgba(22, 21, 19, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #FFFFFF;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.5rem 0.95rem;
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(22, 21, 19, 0.25);
    }

    .swipe-hint-pill svg {
      color: var(--terracotta);
    }

    .combo-head {
      padding: 1.05rem 1.15rem 0.35rem;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.6rem;
    }

    .combo-name {
      font-size: 1.06rem;
      font-weight: 800;
      color: var(--obsidian);
      letter-spacing: -0.015em;
      line-height: 1.25;
      min-width: 0;
      word-break: break-word;
    }

    .card-counter-btn {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--text-muted);
      background: var(--surface-alt);
      border: 1px solid var(--border);
      padding: 0.22rem 0.6rem;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
      cursor: pointer;
    }

    .plate-board {
      padding: 0.25rem 1.15rem 0.45rem;
    }

    .menu-row {
      border-bottom: 1px solid var(--border);
      padding: 0.72rem 0;
      cursor: pointer;
    }

    .menu-row:last-child {
      border-bottom: none;
    }

    .menu-row-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      min-height: 44px;
    }

    .menu-left {
      display: flex;
      flex-direction: column;
      gap: 0.22rem;
      min-width: 0;
      flex: 1;
    }

    .station-pill {
      align-self: flex-start;
      font-size: 0.66rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-muted);
      background: var(--surface-alt);
      padding: 0.14rem 0.48rem;
      border-radius: 6px;
    }

    .food-title {
      font-size: 0.97rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.28;
      word-break: break-word;
    }

    .menu-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
      text-align: right;
    }

    .macro-stack {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .protein-stat {
      font-size: 0.94rem;
      font-weight: 800;
      color: var(--obsidian);
    }

    .cal-stat {
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .chevron {
      width: 17px;
      height: 17px;
      color: var(--text-muted);
      transition: transform 0.2s ease;
    }

    .menu-row.expanded .chevron {
      transform: rotate(180deg);
    }

    .item-details {
      display: none;
      margin-top: 0.55rem;
      padding: 0.6rem 0.75rem;
      background: var(--surface-alt);
      border-radius: 12px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .menu-row.expanded .item-details {
      display: block;
    }

    .plate-footer {
      background: var(--surface-alt);
      border-top: 1px solid var(--border);
      padding: 0.85rem 1.15rem;
    }

    .totals-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.55rem;
    }

    .cal-pill {
      background: var(--obsidian);
      color: #FFFFFF;
      font-size: 0.78rem;
      font-weight: 800;
      padding: 0.22rem 0.65rem;
      border-radius: 999px;
    }

    .macro-pills {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-wrap: wrap;
    }

    .m-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-size: 0.73rem;
      font-weight: 700;
      padding: 0.2rem 0.5rem;
      border-radius: 999px;
    }

    .split-bar-track {
      height: 7px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
      display: flex;
      gap: 2px;
    }

    .split-seg-p { background: var(--obsidian); height: 100%; border-radius: 999px; }
    .split-seg-c { background: var(--terracotta); height: 100%; border-radius: 999px; }
    .split-seg-f { background: var(--leaf); height: 100%; border-radius: 999px; }

    .split-legend {
      display: flex;
      justify-content: space-between;
      margin-top: 0.38rem;
      font-size: 0.71rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .legend-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      margin-right: 4px;
    }

    .deck-dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      margin-top: 0.85rem;
    }

    .deck-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      border: none;
      background: #D5CEC0;
      padding: 0;
      cursor: pointer;
      transition: all 0.22s ease;
    }

    .deck-dot.active {
      width: 24px;
      background: var(--terracotta);
    }

    .floating-dock {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(16px + env(safe-area-inset-bottom));
      z-index: 40;
      padding: 0 1rem;
      pointer-events: none;
    }

    .dock-inner {
      max-width: 540px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      pointer-events: auto;
    }

    .floating-pill {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(22, 21, 19, 0.08);
      padding: 0.34rem;
      border-radius: 999px;
      gap: 0.2rem;
      box-shadow: var(--float-shadow);
    }

    .seg-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.84rem;
      font-weight: 700;
      min-height: 44px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .seg-btn.active {
      background: var(--obsidian);
      color: #FFFFFF;
      box-shadow: 0 3px 10px rgba(22, 21, 19, 0.2);
    }

    .side-filter-btn {
      position: relative;
      width: 52px;
      height: 52px;
      border-radius: 999px;
      border: 1px solid rgba(22, 21, 19, 0.08);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: var(--obsidian);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: var(--float-shadow);
      transition: transform 0.15s ease;
    }

    .side-filter-btn:active {
      transform: scale(0.94);
    }

    .side-filter-btn.has-filters {
      background: var(--obsidian);
      color: #FFFFFF;
    }

    .badge-dot {
      position: absolute;
      top: -2px;
      right: -2px;
      background: var(--terracotta);
      color: #FFFFFF;
      font-size: 0.7rem;
      font-weight: 800;
      min-width: 20px;
      height: 20px;
      padding: 0 4px;
      border-radius: 999px;
      border: 2px solid #FFFFFF;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(22, 21, 19, 0.42);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.24s ease;
    }

    .sheet-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .side-drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 60;
      width: min(380px, 90vw);
      overflow-y: auto;
      background: var(--surface);
      border-radius: 24px 0 0 24px;
      padding: calc(1.1rem + env(safe-area-inset-top)) 1.15rem calc(1.8rem + env(safe-area-inset-bottom));
      transform: translateX(105%);
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: -12px 0 38px rgba(22, 21, 19, 0.22);
    }

    .side-drawer.open {
      transform: translateX(0);
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.05rem;
    }

    .sheet-header h2 {
      font-size: 1.12rem;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .done-btn {
      background: var(--obsidian);
      color: #FFFFFF;
      border: none;
      border-radius: 999px;
      padding: 0.48rem 1.05rem;
      font-size: 0.84rem;
      font-weight: 800;
      cursor: pointer;
    }

    .sheet-section {
      margin-bottom: 1.35rem;
    }

    .sec-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.58rem;
    }

    .sec-title {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .clear-link {
      background: none;
      border: none;
      color: var(--terracotta-dark);
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.48rem;
    }

    .pill-check {
      display: flex;
      align-items: center;
      gap: 0.58rem;
      min-height: 45px;
      padding: 0.5rem 0.8rem;
      border: 1.5px solid var(--border);
      border-radius: 13px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--surface-alt);
    }

    .pill-check:has(input:checked) {
      background: var(--terracotta-soft);
      border-color: var(--terracotta);
      font-weight: 800;
    }

    .pill-check input {
      accent-color: var(--terracotta);
      width: 17px;
      height: 17px;
    }

    .switch-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.78rem 0.9rem;
      background: var(--surface-alt);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      cursor: pointer;
      min-height: 52px;
    }

    .switch-card span {
      font-size: 0.88rem;
      font-weight: 700;
    }

    .switch-card input[type="checkbox"] {
      accent-color: var(--obsidian);
      width: 20px;
      height: 20px;
    }

    .bio-box {
      display: none;
      margin-top: 0.75rem;
      padding: 0.9rem;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .bio-box.open {
      display: block;
    }

    .bio-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.6rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.22rem;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .field input,
    .field select,
    .fb-input,
    .fb-textarea {
      min-height: 44px;
      padding: 0.5rem 0.68rem;
      border: 1.5px solid var(--border);
      border-radius: 11px;
      font-size: 16px;
      font-family: inherit;
      background: #FFFFFF;
      color: var(--text-main);
    }

    .height-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.38rem;
    }

    .safety-note {
      margin-top: 0.65rem;
      font-size: 0.73rem;
      line-height: 1.38;
      color: var(--text-muted);
    }

    .apply-btn {
      width: 100%;
      min-height: 46px;
      margin-top: 0.75rem;
      background: var(--obsidian);
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
    }

    .time-row {
      display: flex;
      gap: 0.45rem;
    }

    .time-row input {
      flex: 1;
      min-height: 46px;
      padding: 0.5rem 0.72rem;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 16px;
    }

    .time-row button {
      min-height: 46px;
      padding: 0 1rem;
      border-radius: 12px;
      border: none;
      background: var(--obsidian);
      color: #FFFFFF;
      font-weight: 800;
      font-size: 0.86rem;
      cursor: pointer;
    }

    .feedback-card {
      background: var(--surface-alt);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .fb-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }

    .fb-chip {
      border: 1px solid var(--border);
      background: #FFFFFF;
      color: var(--text-muted);
      font-size: 0.74rem;
      font-weight: 700;
      padding: 0.28rem 0.6rem;
      border-radius: 999px;
      cursor: pointer;
    }

    .fb-chip.active {
      background: var(--terracotta);
      border-color: var(--terracotta);
      color: #FFFFFF;
    }

    .fb-textarea {
      min-height: 78px;
      resize: vertical;
    }

    .fb-submit-btn {
      min-height: 44px;
      border: none;
      border-radius: 11px;
      background: var(--terracotta);
      color: #FFFFFF;
      font-size: 0.86rem;
      font-weight: 800;
      cursor: pointer;
    }

    .fb-status {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--leaf);
      display: none;
    }

    .skeleton-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1.25rem;
      border: 1px solid var(--border);
    }

    .skel-line {
      height: 16px;
      border-radius: 8px;
      background: linear-gradient(90deg, #EDE8DF 25%, #F7F4EE 50%, #EDE8DF 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
      margin-bottom: 0.75rem;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>
  <header class="topbar">

    <!-- 1. Allergies & Dietary -->
    <div class="sheet-section">

  <script>
    const STORAGE_KEY = 'feast_dining_prefs_v8';

    const state = {
      health_intensity: 'High',
      dietary_filters: [],
      dri_enabled: false,
      meal_goal: 'Balanced Maintenance',
      sex: '',
      age: '',
      weight_lbs: '',
      height_ft: '',
      height_in: '',
      activity_level: '',
      meals_per_day: '',
      sim_time: ''
    };

    let currentRecommendations = [];
    let selectedComboIndexByLoc = {};
    let feedbackCategory = 'Dish Request';
    let hasShownSwipeHint = false;
    let hintShowTimer = null;
    let hintHideTimer = null;

    function loadPreferences() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          delete parsed.include_quick_bites;
          Object.assign(state, parsed);
          state.sim_time = '';
        }
      } catch (e) {}
    }

    function savePreferences() {
      try {
        const toSave = { ...state, sim_time: '' };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
      } catch (e) {}
    }

    function openSheet() {
      document.getElementById('sheet_backdrop').classList.add('open');
      document.getElementById('control_sheet').classList.add('open');
    }

    function closeSheet() {
      document.getElementById('sheet_backdrop').classList.remove('open');
      document.getElementById('control_sheet').classList.remove('open');
    }

    function syncUIToState() {
      document.querySelectorAll('.seg-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === state.health_intensity);
      });

      document.querySelectorAll('#dietary_checkboxes input[type="checkbox"]').forEach(cb => {
        cb.checked = state.dietary_filters.includes(cb.value);
      });

      document.getElementById('dri_toggle').checked = !!state.dri_enabled;
      document.getElementById('dri_drawer').classList.toggle('open', !!state.dri_enabled);

      const extraCount = state.dietary_filters.length + (state.dri_enabled ? 1 : 0);

      const badge = document.getElementById('filter_badge');
      const trigger = document.getElementById('open_sheet_btn');
      if (extraCount > 0) {
        badge.textContent = extraCount;
        badge.style.display = 'inline-flex';
        trigger.classList.add('has-filters');
      } else {
        badge.style.display = 'none';
        trigger.classList.remove('has-filters');
      }

      const pillsRow = document.getElementById('active_pills_row');
      const pills = [];
      if (state.dri_enabled) {
        pills.push(`<span class="mini-badge">Goal: ${escapeHtml(state.meal_goal)}</span>`);
      }
      state.dietary_filters.forEach(f => {
        const label = f.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        pills.push(`<span class="mini-badge light">${escapeHtml(label)}</span>`);
      });

      if (pills.length > 0) {
        pillsRow.innerHTML = pills.join('');
        pillsRow.classList.add('visible');
      } else {
        pillsRow.innerHTML = '';
        pillsRow.classList.remove('visible');
      }

      document.getElementById('meal_goal').value = state.meal_goal || 'Balanced Maintenance';
      document.getElementById('sex').value = state.sex || '';
      document.getElementById('age').value = state.age || '';
      document.getElementById('weight_lbs').value = state.weight_lbs || '';
      document.getElementById('height_ft').value = state.height_ft || '';
      document.getElementById('height_in').value = state.height_in !== '' ? state.height_in : '';
      document.getElementById('activity_level').value = state.activity_level || '';
      document.getElementById('meals_per_day').value = state.meals_per_day || '';
    }

    function readBiometricsFromDOM() {
      state.meal_goal = document.getElementById('meal_goal').value;
      state.sex = document.getElementById('sex').value;
      state.age = document.getElementById('age').value.trim();
      state.weight_lbs = document.getElementById('weight_lbs').value.trim();
      state.height_ft = document.getElementById('height_ft').value;
      state.height_in = document.getElementById('height_in').value;
      state.activity_level = document.getElementById('activity_level').value;
      state.meals_per_day = document.getElementById('meals_per_day').value;
      state.sim_time = document.getElementById('sim_time').value.trim();
    }

    function validateBiometrics() {
      const missing = [];
      if (!state.sex) missing.push('Sex');
      if (!state.age) missing.push('Age');
      if (!state.weight_lbs) missing.push('Weight');
      if (!state.height_ft) missing.push('Height (ft)');
      if (state.height_in === '') missing.push('Height (in)');
      if (!state.activity_level) missing.push('Activity');
      if (!state.meals_per_day) missing.push('Meals/Day');
      return missing;
    }

    function showValidation(msg, inSheet = false) {
      const mainBox = document.getElementById('validation_banner');
      const sheetBox = document.getElementById('sheet_validation');
      mainBox.style.display = 'none';
      sheetBox.style.display = 'none';
      if (!msg) return;
      const target = inSheet ? sheetBox : mainBox;
      target.textContent = msg;
      target.style.display = 'block';
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function dismissSwipeHint() {
      if (hintShowTimer) clearTimeout(hintShowTimer);
      if (hintHideTimer) clearTimeout(hintHideTimer);
      document.querySelectorAll('.swipe-hint-overlay').forEach(el => {
        el.classList.remove('visible');
      });
      document.querySelectorAll('.flashcard.peek-demo').forEach(el => {
        el.classList.remove('peek-demo');
      });
    }

    function scheduleSwipeHint() {
      if (hasShownSwipeHint) return;
      const firstHint = document.querySelector('.swipe-hint-overlay');
      if (!firstHint) return;
      const firstCard = firstHint.closest('.flashcard');

      if (hintShowTimer) clearTimeout(hintShowTimer);
      if (hintHideTimer) clearTimeout(hintHideTimer);

      hintShowTimer = setTimeout(() => {
        if (hasShownSwipeHint) return;
        hasShownSwipeHint = true;
        firstHint.classList.add('visible');
        if (firstCard) {
          firstCard.classList.remove('peek-demo');
          void firstCard.offsetWidth;
          firstCard.classList.add('peek-demo');
        }

        hintHideTimer = setTimeout(() => {
          firstHint.classList.remove('visible');
          if (firstCard) firstCard.classList.remove('peek-demo');
        }, 2800);
      }, 2400);
    }

    function runIncomingCardAnimation(location, direction = 'left') {
      const deck = document.querySelector(`.flashcard-deck[data-location="${CSS.escape(location)}"]`);
      if (!deck) return;
      const card = deck.querySelector('.flashcard');
      if (!card) return;

      const startX = direction === 'left' ? 40 : -40;
      const startRot = direction === 'left' ? 2.5 : -2.5;

      if (card.animate) {
        card.animate(
          [
            { opacity: 0.3, transform: `translate3d(${startX}px, 6px, 0) scale(0.96) rotate(${startRot}deg)` },
            { opacity: 1, transform: 'translate3d(0, 0, 0) scale(1) rotate(0deg)' }
          ],
          {
            duration: 260,
            easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
            fill: 'both'
          }
        );
      }
    }

    function advanceLocationCard(location, direction = 'left') {
      const rec = currentRecommendations.find(r => r.location === location);
      if (!rec || !rec.combos || rec.combos.length <= 1) return;

      dismissSwipeHint();
      const total = rec.combos.length;
      const cur = selectedComboIndexByLoc[location] || 0;
      const next = direction === 'right'
        ? (cur - 1 + total) % total
        : (cur + 1) % total;

      selectedComboIndexByLoc[location] = next;
      renderCardsOnly();
      runIncomingCardAnimation(location, direction);
    }

    function setLocationComboIndex(location, idx) {
      const cur = selectedComboIndexByLoc[location] || 0;
      if (cur === idx) return;
      dismissSwipeHint();

      const deck = document.querySelector(`.flashcard-deck[data-location="${CSS.escape(location)}"]`);
      const card = deck ? deck.querySelector('.flashcard') : null;
      const dir = idx > cur ? 'left' : 'right';

      if (card) {
        card.classList.add(dir === 'left' ? 'shuffle-out-left' : 'shuffle-out-right');
        setTimeout(() => {
          selectedComboIndexByLoc[location] = idx;
          renderCardsOnly();
          runIncomingCardAnimation(location, dir);
        }, 180);
      } else {
        selectedComboIndexByLoc[location] = idx;
        renderCardsOnly();
      }
    }

    function initGlobalDeckDelegation() {
      const feed = document.getElementById('results_container');
      if (!feed || feed.dataset.delegated) return;
      feed.dataset.delegated = 'true';

      let activeDeck = null;
      let activeCard = null;
      let locationName = '';
      let startX = 0;
      let startY = 0;
      let deltaX = 0;
      let isDragging = false;
      let gestureAxis = null;
      let isAnimatingOut = false;

      feed.addEventListener('touchstart', (e) => {
        const deck = e.target.closest('.flashcard-deck');
        if (!deck || parseInt(deck.dataset.count || '1', 10) <= 1 || isAnimatingOut) return;

        activeDeck = deck;
        activeCard = deck.querySelector('.flashcard');
        locationName = deck.dataset.location;
        if (!activeCard) return;

        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        deltaX = 0;
        isDragging = true;
        gestureAxis = null;
        activeCard.classList.remove('peek-demo');
      }, { passive: true });

      feed.addEventListener('touchmove', (e) => {
        if (!isDragging || !activeCard || isAnimatingOut) return;
        const dx = e.touches[0].clientX - startX;
        const dy = e.touches[0].clientY - startY;

        if (gestureAxis === null) {
          if (Math.hypot(dx, dy) < 8) return;
          gestureAxis = Math.abs(dx) >= Math.abs(dy) * 0.75 ? 'horizontal' : 'vertical';
          if (gestureAxis === 'horizontal') {
            activeCard.classList.add('dragging');
            dismissSwipeHint();
          }
        }

        if (gestureAxis !== 'horizontal') return;
        if (e.cancelable) e.preventDefault();

        deltaX = dx;
        const rotateDeg = Math.max(-9, Math.min(9, dx * 0.045));
        activeCard.style.transform = `translate3d(${dx}px, 0, 0) rotate(${rotateDeg}deg)`;
      }, { passive: false });

      const handleEnd = () => {
        if (!isDragging || !activeCard || isAnimatingOut) return;
        isDragging = false;
        activeCard.classList.remove('dragging');

        if (gestureAxis === 'horizontal' && Math.abs(deltaX) > 40) {
          isAnimatingOut = true;
          const dir = deltaX < 0 ? 'left' : 'right';
          activeCard.classList.add(dir === 'left' ? 'shuffle-out-left' : 'shuffle-out-right');
          setTimeout(() => {
            isAnimatingOut = false;
            advanceLocationCard(locationName, dir);
          }, 210);
        } else {
          activeCard.style.transform = '';
        }
        gestureAxis = null;
        activeCard = null;
      };

      feed.addEventListener('touchend', handleEnd, { passive: true });
      feed.addEventListener('touchcancel', handleEnd, { passive: true });

      feed.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        const deck = e.target.closest('.flashcard-deck');
        if (!deck || parseInt(deck.dataset.count || '1', 10) <= 1 || isAnimatingOut) return;

        activeDeck = deck;
        activeCard = deck.querySelector('.flashcard');
        locationName = deck.dataset.location;
        if (!activeCard) return;

        startX = e.clientX;
        startY = e.clientY;
        deltaX = 0;
        isDragging = true;
        gestureAxis = null;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging || !activeCard || isAnimatingOut) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        if (gestureAxis === null) {
          if (Math.hypot(dx, dy) < 8) return;
          gestureAxis = Math.abs(dx) >= Math.abs(dy) * 0.75 ? 'horizontal' : 'vertical';
          if (gestureAxis === 'horizontal') {
            activeCard.classList.add('dragging');
            dismissSwipeHint();
          }
        }

        if (gestureAxis !== 'horizontal') return;

        deltaX = dx;
        const rotateDeg = Math.max(-9, Math.min(9, dx * 0.045));
        activeCard.style.transform = `translate3d(${dx}px, 0, 0) rotate(${rotateDeg}deg)`;
      });

      window.addEventListener('mouseup', () => {
        if (isDragging) handleEnd();
      });
    }

    function renderCardsOnly() {
      const resultsEl = document.getElementById('results_container');
      const recs = currentRecommendations || [];

      if (recs.length === 0) {
        resultsEl.innerHTML = `
          <section class="court-section">
            <div class="flashcard" style="padding:1.25rem;">
              <h2 class="combo-name">No open meals right now</h2>
              <p style="font-size:0.86rem; color:var(--text-muted); margin-top:0.35rem;">
                No open dining options matched those filters. Try adjusting a dietary filter or checking another time.
              </p>
            </div>
          </section>
        `;
        return;
      }

      let renderedFirstHint = false;

      resultsEl.innerHTML = recs.map((rec) => {
        const combos = (rec.combos && rec.combos.length > 0)
          ? rec.combos
          : [{
              combo_name: 'Balanced Meal',
              station_tag: 'Main Line',
              items: rec.items,
              totals: rec.totals,
              macro_split: { protein_pct: 30, carbs_pct: 45, fat_pct: 25 }
            }];

        const activeComboIdx = Math.min(selectedComboIndexByLoc[rec.location] || 0, combos.length - 1);
        const combo = combos[activeComboIdx];
        const hasMultiple = combos.length > 1;
        const safeLoc = escapeHtml(rec.location);

        let hintHtml = '';
        if (hasMultiple && !hasShownSwipeHint && !renderedFirstHint) {
          renderedFirstHint = true;
          hintHtml = `
            <div class="swipe-hint-overlay" aria-hidden="true">
              <div class="swipe-hint-pill">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="19" y1="12" x2="5" y2="12"></line>
                  <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                <span>Swipe card for more options</span>
              </div>
            </div>
          `;
        }

        const underlaysHtml = hasMultiple
          ? `
            ${combos.length > 2 ? '<div class="deck-underlay-2"></div>' : ''}
            <div class="deck-underlay-1" onclick="advanceLocationCard('${safeLoc}', 'left')"></div>
          `
          : '';

        const dotsHtml = hasMultiple
          ? `<div class="deck-dots">
              ${combos.map((_, cIdx) => `
                <button type="button"
                  class="deck-dot ${cIdx === activeComboIdx ? 'active' : ''}"
                  onclick="setLocationComboIndex('${safeLoc}', ${cIdx})"
                  aria-label="Meal option ${cIdx + 1} of ${combos.length}"></button>
              `).join('')}
            </div>`
          : '';

        const itemsHtml = combo.items.map(it => {
          const allergenStr = (it.allergens && it.allergens.length > 0)
            ? `Contains: ${it.allergens.join(', ')}`
            : (it.ingredient_certainty === 'unknown'
                ? 'Allergen/ingredient metadata unverified'
                : 'No major allergens flagged');

          return `
            <div class="menu-row" onclick="this.classList.toggle('expanded')" role="button" tabindex="0">
              <div class="menu-row-main">
                <div class="menu-left">
                  <span class="station-pill">${escapeHtml(it.station)}</span>
                  <div class="food-title">${escapeHtml(it.name)}</div>
                </div>
                <div class="menu-right">
                  <div class="macro-stack">
                    <span class="protein-stat">${Math.round(it.protein)}g P</span>
                    <span class="cal-stat">${Math.round(it.calories)} kcal</span>
                  </div>
                  <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                  </svg>
                </div>
              </div>
              <div class="item-details">
                <div><strong>${Math.round(it.protein)}g Protein</strong> &bull; ${Math.round(it.carbs)}g Carbs &bull; ${Math.round(it.fat)}g Fat</div>
                <div style="margin-top:0.2rem;">${escapeHtml(allergenStr)}</div>
                ${it.reason ? `<div style="margin-top:0.18rem; color:var(--text-main); font-weight:600;">${escapeHtml(it.reason)}</div>` : ''}
              </div>
            </div>
          `;
        }).join('');

        const split = combo.macro_split || { protein_pct: 30, carbs_pct: 45, fat_pct: 25 };

        return `
          <section class="court-section">
            <div class="court-header">
              <h2 class="court-name">${safeLoc}</h2>
              <span class="live-hours"><span class="pulse-dot"></span>${escapeHtml(rec.hours_status)}</span>
            </div>

            <div class="deck-wrapper">
              <div class="flashcard-deck" data-location="${safeLoc}" data-count="${combos.length}">
                ${underlaysHtml}
                <article class="flashcard">
                  ${hintHtml}
                  <div class="combo-head">
                    <div class="combo-name">${escapeHtml(combo.combo_name)}</div>
                    ${hasMultiple ? `<button type="button" class="card-counter-btn" onclick="advanceLocationCard('${safeLoc}', 'left')" title="Next option">${activeComboIdx + 1} / ${combos.length} &rsaquo;</button>` : ''}
                  </div>

                  <div class="plate-board">${itemsHtml}</div>

                  <div class="plate-footer">
                    <div class="totals-header">
                      <span class="cal-pill">${Math.round(combo.totals.calories)} kcal</span>
                      <div class="macro-pills">
                        <span class="m-pill">${Math.round(combo.totals.protein)}g Protein</span>
                        <span class="m-pill">${Math.round(combo.totals.carbs)}g Carbs</span>
                        <span class="m-pill">${Math.round(combo.totals.fat)}g Fat</span>
                      </div>
                    </div>

                    <div class="split-bar-track" aria-label="Macro balance">
                      <div class="split-seg-p" style="width:${split.protein_pct}%"></div>
                      <div class="split-seg-c" style="width:${split.carbs_pct}%"></div>
                      <div class="split-seg-f" style="width:${split.fat_pct}%"></div>
                    </div>
                    <div class="split-legend">
                      <span><i class="legend-dot" style="background:var(--obsidian)"></i>Protein ${split.protein_pct}%</span>
                      <span><i class="legend-dot" style="background:var(--terracotta)"></i>Carbs ${split.carbs_pct}%</span>
                      <span><i class="legend-dot" style="background:var(--leaf)"></i>Fat ${split.fat_pct}%</span>
                    </div>
                  </div>
                </article>
              </div>
              ${dotsHtml}
            </div>
          </section>
        `;
      }).join('');

      initGlobalDeckDelegation();
      scheduleSwipeHint();
    }

    function renderRecommendations(data) {
      const statusEl = document.getElementById('status_text');
      const timePart = (data.timestamp || '').split(' ').slice(1).join(' ') || 'NOW';
      statusEl.innerHTML = `<strong>${escapeHtml(timePart)}</strong> &bull; ${data.open_locations_count} Open`;

      if (data.greeting_title) {
        document.getElementById('greeting_title').textContent = data.greeting_title;
      }
      if (data.greeting_sub) {
        document.getElementById('greeting_sub').textContent = data.greeting_sub;
      }
      if (data.targets && data.targets.disclaimer) {
        document.getElementById('dri_safety_note').textContent = data.targets.disclaimer;
      }

      currentRecommendations = data.recommendations || [];
      selectedComboIndexByLoc = {};
      renderCardsOnly();
    }

    async function fetchRecommendations() {
      readBiometricsFromDOM();
      savePreferences();
      showValidation('');

      const payload = {
        health_intensity: state.health_intensity,
        dietary_filters: state.dietary_filters,
        dri_enabled: state.dri_enabled,
        sim_time: state.sim_time
      };

      if (state.dri_enabled) {
        const missing = validateBiometrics();
        if (missing.length > 0) {
          openSheet();
          document.getElementById('dri_drawer').classList.add('open');
          showValidation(`Enter ${missing.join(', ')} and tap "Apply Goal".`, true);
          return;
        }
        const totalInches = (parseInt(state.height_ft, 10) * 12) + parseInt(state.height_in, 10);
        payload.meal_goal = state.meal_goal;
        payload.sex = state.sex;
        payload.age = parseInt(state.age, 10);
        payload.weight_lbs = parseFloat(state.weight_lbs);
        payload.height_in = totalInches;
        payload.activity_level = state.activity_level;
        payload.meals_per_day = parseInt(state.meals_per_day, 10);
      }

      document.getElementById('status_text').textContent = 'Updating...';

      try {
        const res = await fetch('/api/recommend', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) {
          showValidation(data.error || 'Could not load dining menus.');
          return;
        }
        renderRecommendations(data);
      } catch (err) {
        showValidation('Network hiccup connecting to campus menus.');
      }
    }

    async function submitFeedback() {
      const msgEl = document.getElementById('fb_message');
      const contactEl = document.getElementById('fb_contact');
      const statusEl = document.getElementById('fb_status');
      const btn = document.getElementById('fb_submit_btn');

      const message = msgEl.value.trim();
      if (!message) {
        statusEl.style.color = 'var(--terracotta-dark)';
        statusEl.textContent = 'Write a quick note first!';
        statusEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Sending...';

      try {
        const res = await fetch('/api/feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            category: feedbackCategory,
            message: message,
            contact: contactEl.value.trim()
          })
        });
        const data = await res.json();
        if (res.ok) {
          msgEl.value = '';
          contactEl.value = '';
          statusEl.style.color = 'var(--leaf)';
          statusEl.textContent = data.message || 'Sent — thank you!';
          statusEl.style.display = 'block';
        } else {
          statusEl.style.color = 'var(--terracotta-dark)';
          statusEl.textContent = data.error || 'Could not send feedback.';
          statusEl.style.display = 'block';
        }
      } catch (e) {
        statusEl.style.color = 'var(--terracotta-dark)';
        statusEl.textContent = 'Network error sending note.';
        statusEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send Note';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadPreferences();
      syncUIToState();

      document.querySelectorAll('.seg-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.health_intensity = btn.dataset.mode;
          syncUIToState();
          fetchRecommendations();
        });
      });

      document.getElementById('open_sheet_btn').addEventListener('click', openSheet);
      document.getElementById('open_time_sheet').addEventListener('click', openSheet);
      document.getElementById('close_sheet_btn').addEventListener('click', closeSheet);
      document.getElementById('sheet_backdrop').addEventListener('click', closeSheet);

      document.querySelectorAll('#dietary_checkboxes input[type="checkbox"]').forEach(cb => {
        cb.addEventListener('change', () => {
          state.dietary_filters = Array.from(
            document.querySelectorAll('#dietary_checkboxes input[type="checkbox"]:checked')
          ).map(el => el.value);
          syncUIToState();
          fetchRecommendations();
        });
      });

      document.getElementById('clear_filters_btn').addEventListener('click', () => {
        state.dietary_filters = [];
        syncUIToState();
        fetchRecommendations();
      });

      document.getElementById('dri_toggle').addEventListener('change', (e) => {
        state.dri_enabled = e.target.checked;
        syncUIToState();
        savePreferences();
        if (!state.dri_enabled) {
          showValidation('');
          fetchRecommendations();
        } else {
          const missing = validateBiometrics();
          if (missing.length === 0) {
            fetchRecommendations();
          } else {
            showValidation(`Enter ${missing.join(', ')} to tailor plates.`, true);
          }
        }
      });

      document.getElementById('calculate_dri_btn').addEventListener('click', () => {
        const missing = validateBiometrics();
        if (missing.length === 0) {
          closeSheet();
        }
        fetchRecommendations();
      });

      document.getElementById('clear_biometrics_btn').addEventListener('click', () => {
        state.sex = '';
        state.age = '';
        state.weight_lbs = '';
        state.height_ft = '';
        state.height_in = '';
        state.activity_level = '';
        state.meals_per_day = '';
        state.meal_goal = 'Balanced Maintenance';
        syncUIToState();
        savePreferences();
        showValidation('Stats cleared. Fill in your fields to tailor plates.', true);
      });

      ['meal_goal', 'sex', 'age', 'weight_lbs', 'height_ft', 'height_in', 'activity_level', 'meals_per_day'].forEach(id => {
        document.getElementById(id).addEventListener('change', () => {
          readBiometricsFromDOM();
          savePreferences();
        });
      });

      document.getElementById('apply_time_btn').addEventListener('click', () => {
        closeSheet();
        fetchRecommendations();
      });

      document.getElementById('reset_time_btn').addEventListener('click', () => {
        document.getElementById('sim_time').value = '';
        closeSheet();
        fetchRecommendations();
      });

      document.querySelectorAll('#fb_category_chips .fb-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          document.querySelectorAll('#fb_category_chips .fb-chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          feedbackCategory = chip.dataset.cat;
        });
      });

      document.getElementById('fb_submit_btn').addEventListener('click', submitFeedback);

      fetchRecommendations();
    });
  </script>
</body>
</html>
